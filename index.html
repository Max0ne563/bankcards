<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Card Vault TMA</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Google Fonts: Share Tech Mono (банковский OCR) + Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Space+Grotesk:wght@600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            vaultDark: '#070a0e',
            vaultPanel: '#0e131b',
            vaultBorder: 'rgba(255, 255, 255, 0.08)'
          },
          fontFamily: {
            emboss: ['"Share Tech Mono"', 'Courier', 'monospace'],
            sans: ['"Space Grotesk"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #070a0e;
      color: #e2e8f0;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      overflow-x: hidden;
      font-family: 'Space Grotesk', -apple-system, sans-serif;
    }

    /* 3D Сцена */
    .card-perspective-stage {
      perspective: 1200px;
    }

    .bank-card {
      aspect-ratio: 85.6 / 53.98;
      width: 100%;
      max-width: 350px;
      border-radius: 20px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.12s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }

    /* ================= ФОН В МОМЕНТ СПИНА (ПЕРЕЛИВАЮЩИЙСЯ МОНОХРОМНЫЙ ГРАДИЕНТ) ================= */
    .theme-spinning {
      background: linear-gradient(135deg, #161a22 0%, #262c38 30%, #171b23 50%, #303746 75%, #141720 100%) !important;
      background-size: 300% 300% !important;
      border: 1px solid rgba(255, 255, 255, 0.18) !important;
      box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.8), inset 0 1px 2px rgba(255, 255, 255, 0.3) !important;
      animation: spinShimmer 1.8s ease infinite !important;
    }

    @keyframes spinShimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ================= БАЗОВАЯ ЦВЕТОВАЯ ГАММА ТИПОВ ================= */
    .theme-classic {
      background: radial-gradient(circle at 85% 20%, #0284c7 0%, #0369a1 40%, #075985 70%, #082f49 100%);
      border: 1px solid rgba(56, 189, 248, 0.45);
      box-shadow: 0 25px 50px -10px rgba(2, 132, 199, 0.45), inset 0 1px 2px rgba(255, 255, 255, 0.4);
    }
    .theme-gold {
      background: linear-gradient(135deg, #d97706 0%, #f59e0b 28%, #fbbf24 50%, #b45309 78%, #78350f 100%);
      border: 1px solid rgba(254, 243, 199, 0.65);
      box-shadow: 0 25px 50px -10px rgba(217, 119, 6, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.7);
    }
    .theme-platinum {
      background: linear-gradient(135deg, #e2e8f0 0%, #94a3b8 32%, #64748b 62%, #475569 88%, #1e293b 100%);
      border: 1px solid rgba(248, 250, 252, 0.8);
      box-shadow: 0 25px 50px -10px rgba(148, 163, 184, 0.45), inset 0 1px 2px rgba(255, 255, 255, 0.65);
    }
    .theme-black {
      background: radial-gradient(circle at 35% 20%, #232834 0%, #0d1017 55%, #020305 100%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 25px 55px -10px rgba(0, 0, 0, 0.95), inset 0 1px 1.5px rgba(255, 255, 255, 0.3);
    }

    /* Мягкий и быстрый переход слоев карты (Snappy Spring) */
    .card-transition-surface {
      transition: background 0.38s cubic-bezier(0.16, 1, 0.3, 1), 
                  border-color 0.38s cubic-bezier(0.16, 1, 0.3, 1), 
                  box-shadow 0.38s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* ================= ПРОЦЕДУРНЫЕ УЗОРЫ ДЛЯ КАЖДОГО BIN ================= */
    .pattern-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 1;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .pattern-hidden {
      opacity: 0 !important;
    }

    /* 1. VIZA (BIN 3040): Орбиты и концентрические дуги */
    .pattern-viza {
      background-image: 
        radial-gradient(circle at 75% 50%, transparent 15%, rgba(255, 255, 255, 0.12) 16%, transparent 18%),
        radial-gradient(circle at 75% 50%, transparent 32%, rgba(255, 255, 255, 0.10) 33%, transparent 36%),
        radial-gradient(circle at 75% 50%, transparent 50%, rgba(255, 255, 255, 0.08) 51%, transparent 55%),
        radial-gradient(circle at 75% 50%, transparent 70%, rgba(255, 255, 255, 0.06) 71%, transparent 76%),
        linear-gradient(45deg, transparent 46%, rgba(255, 255, 255, 0.08) 50%, transparent 54%);
    }

    /* 2. MasterKard (BIN 7550): Изометрические линзы и ромбовидная сетка */
    .pattern-masterkard {
      background-image: 
        radial-gradient(circle at 35% 50%, rgba(255, 255, 255, 0.14) 0%, transparent 45%),
        radial-gradient(circle at 65% 50%, rgba(255, 255, 255, 0.14) 0%, transparent 45%),
        repeating-linear-gradient(60deg, transparent, transparent 14px, rgba(255, 255, 255, 0.04) 14px, rgba(255, 255, 255, 0.04) 15px),
        repeating-linear-gradient(-60deg, transparent, transparent 14px, rgba(255, 255, 255, 0.04) 14px, rgba(255, 255, 255, 0.04) 15px);
    }

    /* 3. OnionPay (BIN 1862): Ориентальная микросетка */
    .pattern-onionpay {
      background-image: 
        repeating-linear-gradient(135deg, transparent, transparent 12px, rgba(255, 255, 255, 0.05) 12px, rgba(255, 255, 255, 0.05) 24px),
        radial-gradient(rgba(255, 255, 255, 0.12) 1.5px, transparent 1.5px);
      background-size: 100% 100%, 14px 14px;
    }

    /* 4. МИГ (BIN 9200): Сверхзвуковые стрелы и лучи */
    .pattern-mig {
      background-image: 
        linear-gradient(110deg, transparent 20%, rgba(255, 255, 255, 0.15) 22%, transparent 26%),
        linear-gradient(110deg, transparent 42%, rgba(255, 255, 255, 0.18) 44%, transparent 48%),
        linear-gradient(110deg, transparent 66%, rgba(255, 255, 255, 0.12) 68%, transparent 71%),
        repeating-linear-gradient(0deg, transparent, transparent 6px, rgba(255, 255, 255, 0.02) 6px, rgba(255, 255, 255, 0.02) 7px);
    }

    /* ================= КРИСТАЛЬНЫЙ 3D ЭМБОССИНГ ЦИФР ================= */
    .embossed-text {
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      letter-spacing: 0.15em;
      position: relative;
    }

    .emboss-silver {
      color: #ffffff;
      background: linear-gradient(180deg, #ffffff 0%, #e2e8f0 40%, #94a3b8 58%, #f8fafc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(1px 2px 0px rgba(0, 0, 0, 0.95)) drop-shadow(-1px -1px 0px rgba(255, 255, 255, 0.8));
    }

    .emboss-gold {
      color: #fffbeb;
      background: linear-gradient(180deg, #ffffff 0%, #fef08a 38%, #ca8a04 62%, #fef9c3 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(1px 2px 0px rgba(0, 0, 0, 0.95)) drop-shadow(-1px -1px 0px rgba(255, 255, 255, 0.85));
    }

    /* Казино-разгон цифр */
    .slot-digit-spin {
      display: inline-block;
      filter: blur(1.2px);
      opacity: 0.85;
      transform: translateY(-1.5px) scale(1.02);
      transition: filter 0.15s ease, transform 0.15s ease;
      color: #38bdf8 !important;
      -webkit-text-fill-color: #38bdf8 !important;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.9);
    }

    /* Анимация кручения логотипа */
    .logo-flip {
      animation: logoShuffle 0.22s ease-in-out infinite alternate;
    }

    @keyframes logoShuffle {
      0% { transform: translateY(3px) scale(0.95); opacity: 0.7; }
      100% { transform: translateY(-3px) scale(1.03); opacity: 1; }
    }

    /* Голографический блик */
    .holo-sheen {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      pointer-events: none;
      background: linear-gradient(115deg, transparent 20%, rgba(255, 255, 255, 0.08) 45%, rgba(255, 255, 255, 0.32) 50%, rgba(255, 255, 255, 0.08) 55%, transparent 80%);
      background-size: 250% 250%;
      background-position: 50% 50%;
      mix-blend-mode: overlay;
      opacity: 0.85;
      transition: background-position 0.1s ease-out;
      z-index: 20;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="flex flex-col justify-between p-4 max-w-md mx-auto min-h-screen">

  <!-- ================= 1. ШАПКА: ПРОФИЛЬ ТЕЛЕГРАМ ================= -->
  <header class="w-full flex items-center justify-between bg-vaultPanel border border-vaultBorder rounded-2xl px-3.5 py-2.5 shadow-md">
    <div class="flex items-center space-x-3 overflow-hidden">
      <div class="relative w-9 h-9 flex-shrink-0">
        <div id="avatarFallback" class="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-600 to-blue-600 flex items-center justify-center font-bold text-white text-xs shadow">
          U
        </div>
        <img id="avatarImg" src="" alt="" class="w-9 h-9 rounded-xl object-cover shadow hidden" onerror="this.classList.add('hidden'); document.getElementById('avatarFallback').classList.remove('hidden');">
      </div>
      <div class="flex flex-col min-w-0">
        <span id="userName" class="text-xs font-bold text-slate-100 truncate">Telegram User</span>
        <span id="userHandle" class="text-[10px] text-cyan-400 font-mono truncate">@handle</span>
      </div>
    </div>

    <!-- Кнопка хранилища -->
    <button onclick="openInventoryModal()" class="flex items-center space-x-2 px-3 py-1.5 rounded-xl bg-slate-800/80 border border-slate-700/80 active:scale-95 transition-transform">
      <span class="text-[11px] font-semibold text-slate-300">Склад:</span>
      <span id="inventoryCountBadge" class="text-[11px] font-bold text-emerald-400 font-mono">0</span>
    </button>
  </header>

  <!-- ================= 2. ОСНОВНАЯ ЗОНА: БОЛЬШАЯ РЕДКОСТЬ + КАРТА ================= -->
  <main class="w-full my-auto flex flex-col items-center py-2">
    
    <!-- ИНФОРМАЦИОННЫЙ БАР НАД КАРТОЙ С БОЛЬШИМ СЛОВОМ РЕДКОСТИ -->
    <div class="w-full max-w-[350px] mb-3 px-4 py-3 bg-vaultPanel/95 border border-vaultBorder rounded-2xl flex flex-col items-center shadow-xl backdrop-blur-sm transition-all duration-300">
      
      <!-- БОЛЬШОЕ СЛОВО РЕДКОСТИ -->
      <div class="w-full flex items-center justify-center py-0.5">
        <h1 id="heroRarityText" class="text-2xl sm:text-3xl font-black tracking-wider uppercase transition-all duration-300 drop-shadow-md text-[#94a3b8]">
          ОБЫЧНЫЙ
        </h1>
      </div>

      <!-- СТРОКА ПОД РЕДКОСТЬЮ: ТИП И ПЛАТЕЖНАЯ СИСТЕМА С ЛОГОТИПОМ -->
      <div class="w-full mt-2 pt-2 border-t border-slate-800/90 flex items-center justify-between px-1">
        
        <!-- ТИП КАРТЫ -->
        <div class="flex items-center space-x-1.5">
          <span class="text-[10px] uppercase font-mono text-slate-500 font-bold">ТИП:</span>
          <span id="heroTierBadge" class="text-[11px] font-mono font-bold tracking-wider px-2 py-0.5 rounded bg-slate-800 text-sky-400 border border-slate-700/80">
            CLASSIC
          </span>
        </div>

        <!-- ПЛАТЕЖНАЯ СИСТЕМА: МИНИ-ЛОГОТИП + НАЗВАНИЕ В ОДНОМ СТИЛЕ -->
        <div class="flex items-center space-x-2">
          <div id="heroMiniLogoSlot" class="h-4 flex items-center justify-center"></div>
          <span id="heroNetworkName" class="text-xs font-black tracking-wide font-sans text-white">
            VIZA
          </span>
        </div>

      </div>

    </div>

    <!-- КАРТА (ТОЛЬКО ЧИП, NFC, 16-ЗНАЧНЫЙ НОМЕР И ЛОГОТИП СПРАВА ВНИЗУ) -->
    <div class="card-perspective-stage w-full flex justify-center">
      <div id="cardStage" class="bank-card card-transition-surface theme-classic p-5 sm:p-6 flex flex-col justify-between cursor-pointer">
        
        <!-- Процедурный узор конкретного BIN -->
        <div id="cardPattern" class="pattern-overlay pattern-viza"></div>

        <!-- Световой блик наклона -->
        <div id="holoSheen" class="holo-sheen"></div>

        <!-- ВЕРХ: EMV-ЧИП СЛЕВА + ПРАВИЛЬНЫЙ NFC ЗНАЧОК СПРАВА -->
        <div class="flex justify-between items-start z-10">
          <div class="w-11 h-8 rounded-md bg-gradient-to-br from-[#f6d365] via-[#d4af37] to-[#aa7c11] p-1 flex flex-col justify-between shadow-md border border-amber-200/50">
            <div class="w-full h-[1px] bg-amber-950/40"></div>
            <div class="flex justify-between items-center h-2">
              <div class="w-2.5 h-[1px] bg-amber-950/40"></div>
              <div class="w-2.5 h-2.5 rounded border border-amber-950/40"></div>
              <div class="w-2.5 h-[1px] bg-amber-950/40"></div>
            </div>
            <div class="w-full h-[1px] bg-amber-950/40"></div>
          </div>

          <!-- Значок NFC: вертикальные дуги, расширяющиеся НАПРАВО -->
          <div class="text-white/85 drop-shadow-md">
            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <path d="M7 6a10 10 0 0 1 0 12" />
              <path d="M11 4a14 14 0 0 1 0 16" />
              <path d="M15 2a18 18 0 0 1 0 20" />
            </svg>
          </div>
        </div>

        <!-- ЦЕНТР: 16-ЗНАЧНЫЙ НОМЕР С ЭМБОССИНГОМ -->
        <div class="my-auto z-10 pt-2">
          <div id="cardNumberDisplay" class="flex justify-between text-[1.18rem] sm:text-[1.35rem] font-bold tracking-widest embossed-text emboss-silver">
            <span id="numGrp0">3040</span>
            <span id="numGrp1">8492</span>
            <span id="numGrp2">1048</span>
            <span id="numGrp3">2914</span>
          </div>

          <div class="flex justify-end items-center mt-1">
            <span id="copyToast" class="text-[9px] font-mono font-bold text-cyan-300 opacity-0 transition-opacity">НОМЕР СКОПИРОВАН</span>
          </div>
        </div>

        <!-- НИЗ КАРТЫ: ТОЛЬКО ЛОГОТИП ПЛАТЕЖНОЙ СИСТЕМЫ В ПРАВОМ НИЖНЕМ УГЛУ -->
        <div class="flex justify-end items-end z-10">
          <div id="cardLogoSlot" class="h-9 flex items-end justify-end transition-transform duration-200"></div>
        </div>

      </div>
    </div>
  </main>

  <!-- ================= 3. ПАНЕЛЬ УПРАВЛЕНИЯ ================= -->
  <footer class="w-full space-y-2.5 z-20">
    <button id="rollButton" onclick="startCardRoll()" class="w-full py-3.5 rounded-2xl font-bold text-sm tracking-wider uppercase bg-gradient-to-r from-blue-600 via-indigo-600 to-cyan-500 text-white shadow-lg shadow-blue-500/25 active:scale-[0.98] transition-all flex items-center justify-center space-x-2">
      <span id="rollButtonText">КРУТИТЬ КАРТУ</span>
    </button>

    <div class="p-2 rounded-xl bg-vaultPanel/60 border border-vaultBorder">
      <p class="text-[9px] text-slate-400 font-mono text-center leading-relaxed">
        🛡️ <span class="text-slate-300 font-bold">ANTI-LUHN SAFEGUARD:</span> 16-я цифра рассчитывается со сдвигом. Номер перманентно не проходит проверку контрольной суммы.
      </p>
    </div>
  </footer>

  <!-- ================= 4. МОДАЛЬНОЕ ОКНО ИНВЕНТАРЯ ================= -->
  <div id="inventoryModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex flex-col justify-end">
    <div class="bg-vaultPanel border-t border-vaultBorder rounded-t-3xl p-5 max-h-[85vh] flex flex-col">
      <div class="flex justify-between items-center pb-3 border-b border-slate-800">
        <div>
          <h3 class="text-sm font-bold text-white uppercase tracking-wider">Инвентарь карт</h3>
          <p class="text-[10px] text-slate-400 font-mono">Сохраняется в локальной памяти</p>
        </div>
        <button onclick="closeInventoryModal()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-300 flex items-center justify-center text-sm font-bold active:scale-95">✕</button>
      </div>

      <div id="inventoryList" class="overflow-y-auto no-scrollbar py-3 space-y-2.5 my-auto"></div>

      <button onclick="clearInventory()" class="w-full py-2.5 rounded-xl bg-red-950/40 border border-red-800/40 text-red-300 text-xs font-bold active:scale-98 transition">
        Очистить инвентарь
      </button>
    </div>
  </div>

        titleStyle: 'font-weight: 900; letter-spacing: 0.5px; color: #22c55e;',
        // Изумрудные буквы М, И + Г со сверхзвуковым голубым крылом
        svg: `
          <svg class="h-8 w-auto" viewBox="0 0 160 55" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 5 50 V 6 H 18 L 29 28 L 40 6 H 53 V 50 H 39 V 23 L 30 40 H 28 L 19 23 V 50 H 5 Z" fill="#22C55E" />
            <path d="M 62 50 V 6 H 76 V 32 L 95 6 H 109 V 50 H 95 V 23 L 76 50 H 62 Z" fill="#22C55E" />
            <path d="M 118 50 V 22 H 133 V 50 H 118 Z" fill="#22C55E" />
            <path d="M 116 6 H 158 C 158 14 150 18 138 18 H 116 V 6 Z" fill="#0EA5E9" />
          </svg>
        `,
        miniSvg: `
          <svg class="h-3.5 w-auto" viewBox="0 0 160 55" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M 5 50 V 6 H 18 L 29 28 L 40 6 H 53 V 50 H 39 V 23 L 30 40 H 28 L 19 23 V 50 H 5 Z" fill="#22C55E" />
            <path d="M 62 50 V 6 H 76 V 32 L 95 6 H 109 V 50 H 95 V 23 L 76 50 H 62 Z" fill="#22C55E" />
            <path d="M 118 50 V 22 H 133 V 50 H 118 Z" fill="#22C55E" />
            <path d="M 116 6 H 158 C 158 14 150 18 138 18 H 116 V 6 Z" fill="#0EA5E9" />
          </svg>
        `
      }
    ];

    /* ----------------------------------------------------
       Б. ТИПЫ (УРОВНИ) КАРТ
       ---------------------------------------------------- */
    const CARD_TIERS = [
      { 
        id: 'classic', 
        name: 'CLASSIC', 
        weight: 60.0, 
        themeClass: 'theme-classic', 
        embossStyle: 'emboss-silver',
        color: '#38bdf8' 
      },
      { 
        id: 'gold', 
        name: 'GOLD', 
        weight: 25.0, 
        themeClass: 'theme-gold', 
        embossStyle: 'emboss-gold',
        color: '#fbbf24' 
      },
      { 
        id: 'platinum', 
        name: 'PLATINUM', 
        weight: 11.0, 
        themeClass: 'theme-platinum', 
        embossStyle: 'emboss-silver',
        color: '#e2e8f0' 
      },
      { 
        id: 'black', 
        name: 'BLACK', 
        weight: 4.0, 
        themeClass: 'theme-black', 
        embossStyle: 'emboss-silver',
        color: '#a855f7' 
      }
    ];

    /* ----------------------------------------------------
       В. РАСЧЕТ РЕДКОСТИ И ЕЕ ЦВЕТОВ
       ---------------------------------------------------- */
    function evaluateCardRarity(tierId, digits16) {
      const numStr = digits16.join('');
      const middle = numStr.substring(4, 15);

      const isFourSame = /(.)\1\1\1/.test(middle);
      const isAscending = /0123|1234|2345|3456|4567|5678|6789/.test(middle);
      const isPairs = /(\d)\1.*(\d)\2/.test(middle);

      // МИФИЧЕСКИЙ (Неоновый фиолетовый)
      if (tierId === 'black' && (isFourSame || isAscending)) {
        return { 
          name: 'МИФИЧЕСКИЙ', 
          color: '#c084fc', 
          glow: '0 0 25px rgba(192, 132, 252, 0.7)'
        };
      }
      // ЛЕГЕНДАРНЫЙ (Золотой)
      if (tierId === 'black' || isFourSame) {
        return { 
          name: 'ЛЕГЕНДАРНЫЙ', 
          color: '#fbbf24', 
          glow: '0 0 22px rgba(251, 191, 36, 0.65)'
        };
      }
      // РЕДКИЙ (Серый металлик)
      if (tierId === 'platinum' || tierId === 'gold' || isAscending || isPairs) {
        return { 
          name: 'РЕДКИЙ', 
          color: '#cbd5e1', 
          glow: '0 0 12px rgba(203, 213, 225, 0.35)'
        };
      }
      // ОБЫЧНЫЙ (Серый)
      return { 
        name: 'ОБЫЧНЫЙ', 
        color: '#94a3b8', 
        glow: 'none'
      };
    }

    function pickWeighted(list) {
      const rand = Math.random() * 100;
      let sum = 0;
      for (const item of list) {
        sum += item.weight;
        if (rand <= sum) return item;
      }
      return list[0];
    }

    /* ----------------------------------------------------
       Г. ЗВУКОВОЙ СИНТЕЗАТОР (WEB AUDIO API)
       ---------------------------------------------------- */
    let audioCtx = null;
    function playBeep(freq = 440, type = 'sine', duration = 0.05, gainVal = 0.04) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    /* ----------------------------------------------------
       Д. АНТИ-ЛУНА ГЕНЕРАТОР
       ---------------------------------------------------- */
    function generateAntiLuhnCardNumber(binPrefix) {
      let digits = binPrefix.split('').map(Number);
      while (digits.length < 15) {
        digits.push(Math.floor(Math.random() * 10));
      }

      let sum = 0;
      for (let i = 0; i < 15; i++) {
        let d = digits[14 - i];
        if (i % 2 === 0) {
          d *= 2;
          if (d > 9) d -= 9;
        }
        sum += d;
      }

      const validCheck = (10 - (sum % 10)) % 10;
      const invalidCheck = (validCheck + 3) % 10;
      digits.push(invalidCheck);

      const str = digits.join('');
      return [
        str.substring(0, 4),
        str.substring(4, 8),
        str.substring(8, 12),
        str.substring(12, 16)
      ];
    }

    /* ----------------------------------------------------
       Е. ТЕЛЕГРАМ ПРОФИЛЬ И HAPTIC FEEDBACK
       ---------------------------------------------------- */
    function initTelegramIntegration() {
      const tg = window.Telegram?.WebApp;
      if (tg) {
        tg.ready();
        tg.expand();
        try {
          tg.setHeaderColor('#070a0e');
          tg.setBackgroundColor('#070a0e');
        } catch(e) {}
      }

      const user = tg?.initDataUnsafe?.user;
      const nameEl = document.getElementById('userName');
      const handleEl = document.getElementById('userHandle');
      const avatarFallback = document.getElementById('avatarFallback');
      const avatarImg = document.getElementById('avatarImg');

      if (user) {
        const full = [user.first_name, user.last_name].filter(Boolean).join(' ') || 'Telegram User';
        nameEl.innerText = full;
        handleEl.innerText = user.username ? `@${user.username}` : `ID: ${user.id}`;

        if (user.photo_url) {
          avatarImg.src = user.photo_url;
          avatarImg.classList.remove('hidden');
          avatarFallback.classList.add('hidden');
        } else {
          avatarFallback.innerText = (user.first_name[0] || 'U').toUpperCase();
        }
      } else {
        nameEl.innerText = "Pavel Durov";
        handleEl.innerText = "@durov";
      }
    }

    function triggerHaptic(type = 'light') {
      const tg = window.Telegram?.WebApp;
      if (tg?.HapticFeedback) {
        if (type === 'success' || type === 'warning' || type === 'error') {
          tg.HapticFeedback.notificationOccurred(type);
        } else {
          tg.HapticFeedback.impactOccurred(type);
        }
      }
    }

    /* ----------------------------------------------------
       Ж. ОБНОВЛЕНИЕ ВИЗУАЛА КАРТЫ И ИНФО-ПАНЕЛИ
       ---------------------------------------------------- */
    let currentNetwork = NETWORKS[0];
    let currentTier = CARD_TIERS[0];
    let currentDigits = ['3040', '8492', '1048', '2914'];

    function applyCardVisuals(net, tier, digits) {
      const card = document.getElementById('cardStage');
      const pattern = document.getElementById('cardPattern');

      // 1. Применяем стиль типа
      CARD_TIERS.forEach(t => card.classList.remove(t.themeClass));
      card.classList.remove('theme-spinning');
      card.classList.add(tier.themeClass);

      // 2. Узор под конкретный BIN
      pattern.classList.remove('pattern-hidden');
      NETWORKS.forEach(n => pattern.classList.remove(n.patternClass));
      pattern.classList.add(net.patternClass);

      // 3. Эмбоссинг номера
      const numDisplay = document.getElementById('cardNumberDisplay');
      numDisplay.classList.remove('emboss-silver', 'emboss-gold');
      numDisplay.classList.add(tier.embossStyle);

      // 4. Логотип в правом нижнем углу
      const logoSlot = document.getElementById('cardLogoSlot');
      logoSlot.classList.remove('logo-flip');
      logoSlot.innerHTML = net.svg;

      // 5. Обновление инфо-панели над картой
      const rarity = evaluateCardRarity(tier.id, digits);
      const heroRarity = document.getElementById('heroRarityText');
      heroRarity.innerText = rarity.name;
      heroRarity.style.color = rarity.color;
      heroRarity.style.textShadow = rarity.glow;

      const heroTier = document.getElementById('heroTierBadge');
      heroTier.innerText = tier.name;
      heroTier.style.color = tier.color;

      document.getElementById('heroMiniLogoSlot').innerHTML = net.miniSvg;
      
      const heroNetName = document.getElementById('heroNetworkName');
      heroNetName.innerText = net.name;
      heroNetName.style = net.titleStyle;
    }

    /* ----------------------------------------------------
       З. СЛОТ-РУЛЕТКА (КАЗИНО-ЭФФЕКТ И БЕСЦВЕТНЫЙ ГРАДИЕНТ)
       ---------------------------------------------------- */
    let isRolling = false;

    function startCardRoll() {
      if (isRolling) return;
      isRolling = true;
      triggerHaptic('medium');
      playBeep(320, 'square', 0.08, 0.06);

      const btn = document.getElementById('rollButton');
      const btnText = document.getElementById('rollButtonText');
      const card = document.getElementById('cardStage');
      const pattern = document.getElementById('cardPattern');
      const logoSlot = document.getElementById('cardLogoSlot');
      const grp0 = document.getElementById('numGrp0');
      const grp1 = document.getElementById('numGrp1');
      const grp2 = document.getElementById('numGrp2');
      const grp3 = document.getElementById('numGrp3');

      btn.disabled = true;
      btn.classList.add('opacity-75');
      btnText.innerText = 'ПОДБОР ПЛАСТИКА...';

      // 1. МГНОВЕННЫЙ СБРОС ФОНА: активируем мерцающий серый градиент, скрываем старый узор
      CARD_TIERS.forEach(t => card.classList.remove(t.themeClass));
      card.classList.add('theme-spinning');
      pattern.classList.add('pattern-hidden');

      // 2. Включаем казино-разгон для цифр и вращение логотипа
      [grp0, grp1, grp2, grp3].forEach(el => el.classList.add('slot-digit-spin'));
      logoSlot.classList.add('logo-flip');

      const targetNetwork = NETWORKS[Math.floor(Math.random() * NETWORKS.length)];
      const targetTier = pickWeighted(CARD_TIERS);
      const targetNumber = generateAntiLuhnCardNumber(targetNetwork.bin);

      let step = 0;
      const totalSteps = 24;
      let delay = 35; // Очень быстрый начальный разгон казино-автомата

      function casinoSpinLoop() {
        step++;

        // Быстрая смена логотипов и цифр в процессе
        const tempNet = NETWORKS[Math.floor(Math.random() * NETWORKS.length)];
        logoSlot.innerHTML = tempNet.svg;
        document.getElementById('heroMiniLogoSlot').innerHTML = tempNet.miniSvg;
        document.getElementById('heroNetworkName').innerText = tempNet.name;

        // Постепенное «залипание» барабанов слева направо
        if (step < 12) {
          grp0.innerText = tempNet.bin;
          grp1.innerText = Math.floor(1000 + Math.random() * 9000);
          grp2.innerText = Math.floor(1000 + Math.random() * 9000);
          grp3.innerText = Math.floor(1000 + Math.random() * 9000);
        } else if (step < 16) {
          grp0.innerText = targetNumber[0];
          grp0.classList.remove('slot-digit-spin');
          grp1.innerText = Math.floor(1000 + Math.random() * 9000);
          grp2.innerText = Math.floor(1000 + Math.random() * 9000);
          grp3.innerText = Math.floor(1000 + Math.random() * 9000);
        } else if (step < 20) {
          grp1.innerText = targetNumber[1];
          grp1.classList.remove('slot-digit-spin');
          grp2.innerText = Math.floor(1000 + Math.random() * 9000);
          grp3.innerText = Math.floor(1000 + Math.random() * 9000);
        } else {
          grp2.innerText = targetNumber[2];
          grp2.classList.remove('slot-digit-spin');
          grp3.innerText = Math.floor(1000 + Math.random() * 9000);
        }

        playBeep(480 + step * 24, 'triangle', 0.025, 0.03);

        if (step < totalSteps) {
          delay += 4.5; // Плавное торможение барабана
          setTimeout(casinoSpinLoop, delay);
        } else {
          // 3. ФИНИШ: Мягкий, но быстрый переход на выпавшую карту
          grp3.innerText = targetNumber[3];
          grp3.classList.remove('slot-digit-spin');

          currentNetwork = targetNetwork;
          currentTier = targetTier;
          currentDigits = targetNumber;

          applyCardVisuals(currentNetwork, currentTier, currentDigits);

          btn.disabled = false;
          btn.classList.remove('opacity-75');
          btnText.innerText = 'КРУТИТЬ КАРТУ';
          isRolling = false;

          const rarity = evaluateCardRarity(currentTier.id, currentDigits);

          saveCardToStorage({
            number: targetNumber.join(' '),
            network: currentNetwork.name,
            tier: currentTier.name,
            bin: currentNetwork.bin,
            rarity: rarity.name,
            color: rarity.color,
            date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          });

          if (rarity.name === 'МИФИЧЕСКИЙ' || rarity.name === 'ЛЕГЕНДАРНЫЙ') {
            triggerHaptic('success');
            playBeep(920, 'sine', 0.25, 0.1);
          } else {
            triggerHaptic('heavy');
            playBeep(640, 'sine', 0.1, 0.06);
          }
        }
      }

      casinoSpinLoop();
    }

    /* ----------------------------------------------------
       И. 3D НАКЛОН И СВЕТОВОЙ БЛИК
       ---------------------------------------------------- */
    const stage = document.getElementById('cardStage');
    const sheen = document.getElementById('holoSheen');

    function handleCardMove(x, y, rect) {
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const rotY = ((x - centerX) / (rect.width / 2)) * 14;
      const rotX = -((y - centerY) / (rect.height / 2)) * 14;

      stage.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg) scale(1.02)`;
      sheen.style.backgroundPosition = `${50 + rotY * 2.5}% ${50 + rotX * 2.5}%`;
    }

    function resetCardMove() {
      stage.style.transform = `rotateX(0deg) rotateY(0deg) scale(1)`;
      sheen.style.backgroundPosition = `50% 50%`;
    }

    stage.addEventListener('mousemove', (e) => handleCardMove(e.clientX, e.clientY, stage.getBoundingClientRect()));
    stage.addEventListener('mouseleave', resetCardMove);

    stage.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        handleCardMove(e.touches[0].clientX, e.touches[0].clientY, stage.getBoundingClientRect());
      }
    }, { passive: true });
    stage.addEventListener('touchend', resetCardMove);

    /* ----------------------------------------------------
       К. КОПИРОВАНИЕ НОМЕРА
       ---------------------------------------------------- */
    stage.addEventListener('click', () => {
      const fullNumber = [
        document.getElementById('numGrp0').innerText,
        document.getElementById('numGrp1').innerText,
        document.getElementById('numGrp2').innerText,
        document.getElementById('numGrp3').innerText
      ].join(' ');

      const input = document.createElement('input');
      input.value = fullNumber;
      document.body.appendChild(input);
      input.select();
      document.execCommand('copy');
      document.body.removeChild(input);

      triggerHaptic('light');
      playBeep(750, 'sine', 0.05, 0.04);

      const toast = document.getElementById('copyToast');
      toast.classList.remove('opacity-0');
      setTimeout(() => toast.classList.add('opacity-0'), 1300);
    });

    /* ----------------------------------------------------
       Л. ИНВЕНТАРЬ (LOCALSTORAGE)
       ---------------------------------------------------- */
    function getStoredCards() {
      try {
        return JSON.parse(localStorage.getItem('vault_cards_v3') || '[]');
      } catch (e) {
        return [];
      }
    }

    function saveCardToStorage(cardObj) {
      const list = getStoredCards();
      list.unshift(cardObj);
      if (list.length > 50) list.pop();
      localStorage.setItem('vault_cards_v3', JSON.stringify(list));
      updateInventoryBadge();
    }

    function updateInventoryBadge() {
      document.getElementById('inventoryCountBadge').innerText = getStoredCards().length;
    }

    function openInventoryModal() {
      triggerHaptic('light');
      const modal = document.getElementById('inventoryModal');
      const listContainer = document.getElementById('inventoryList');
      const cards = getStoredCards();

      if (cards.length === 0) {
        listContainer.innerHTML = `
          <div class="text-center py-8 text-slate-500 font-mono text-xs">
            Склад пуст.<br>Нажмите «Крутить карту» для первой генерации!
          </div>
        `;
      } else {
        listContainer.innerHTML = cards.map(c => `
          <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-3 flex justify-between items-center">
            <div>
              <span class="text-xs font-mono font-bold text-slate-100 tracking-wider">${c.number}</span>
              <div class="flex items-center space-x-1.5 mt-1">
                <span class="text-[9px] font-mono px-2 py-0.5 rounded bg-slate-800 font-bold" style="color: ${c.color}">
                  ${c.rarity}
                </span>
                <span class="text-[9px] font-mono px-1.5 py-0.5 rounded bg-slate-800/80 text-slate-300">
                  ${c.tier}
                </span>
                <span class="text-[10px] text-cyan-400 font-semibold">${c.bin} • ${c.network}</span>
              </div>
            </div>
            <span class="text-[9px] font-mono text-slate-500">${c.date}</span>
          </div>
        `).join('');
      }

      modal.classList.remove('hidden');
    }

    function closeInventoryModal() {
      triggerHaptic('light');
      document.getElementById('inventoryModal').classList.add('hidden');
    }

    function clearInventory() {
      triggerHaptic('warning');
      localStorage.removeItem('vault_cards_v3');
      updateInventoryBadge();
      openInventoryModal();
    }

    window.addEventListener('load', () => {
      initTelegramIntegration();
      applyCardVisuals(currentNetwork, currentTier, currentDigits);
      updateInventoryBadge();
    });
  </script>
</body>
