<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Card Vault TMA</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Google Fonts: Share Tech Mono + Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Space+Grotesk:wght@600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            vaultDark: '#070a0e',
            vaultPanel: '#0e131b',
            vaultBorder: 'rgba(255, 255, 255, 0.08)'
          },
          fontFamily: {
            emboss: ['"Share Tech Mono"', 'Courier', 'monospace'],
            sans: ['"Space Grotesk"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #070a0e;
      color: #e2e8f0;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      overflow-x: hidden;
      font-family: 'Space Grotesk', -apple-system, sans-serif;
    }

    .card-perspective-stage {
      perspective: 1200px;
    }

    /* ПЛАВНОЕ ИНЕРЦИОННОЕ УТАПЛИВАНИЕ КАРТЫ */
    .bank-card {
      aspect-ratio: 85.6 / 53.98;
      width: 100%;
      max-width: 350px;
      border-radius: 20px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.75s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.75s cubic-bezier(0.22, 1, 0.36, 1);
      overflow: hidden;
    }

    /* СЛОЕНЫЙ ОВЕРЛЕЙ КРУЧЕНИЯ */
    .card-spin-overlay {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      background: linear-gradient(135deg, #151821 0%, #2a313e 25%, #161a22 50%, #363f50 75%, #13161f 100%);
      background-size: 300% 300%;
      opacity: 0;
      pointer-events: none;
      z-index: 5;
      transition: opacity 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .card-spin-overlay.active {
      opacity: 1;
      animation: spinShimmer 1.1s ease infinite;
    }

    /* Мягкое плавное сжатие */
    .card-compressed {
      transform: scale(0.93) rotateX(8deg) translateY(4px) !important;
      box-shadow: 0 12px 30px -6px rgba(0, 0, 0, 0.95), inset 0 1px 2px rgba(255, 255, 255, 0.18) !important;
    }

    @keyframes spinShimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ТЕМЫ КАРТ */
    .theme-classic {
      background: radial-gradient(circle at 85% 20%, #0284c7 0%, #0369a1 40%, #075985 70%, #082f49 100%);
      border: 1px solid rgba(56, 189, 248, 0.5);
      box-shadow: 0 25px 50px -10px rgba(2, 132, 199, 0.45), inset 0 1px 2px rgba(255, 255, 255, 0.4);
    }
    .theme-gold {
      background: linear-gradient(135deg, #d97706 0%, #f59e0b 28%, #fbbf24 50%, #b45309 78%, #78350f 100%);
      border: 1px solid rgba(254, 243, 199, 0.65);
      box-shadow: 0 25px 50px -10px rgba(217, 119, 6, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.7);
    }
    .theme-platinum {
      background: linear-gradient(135deg, #cbd5e1 0%, #94a3b8 32%, #64748b 62%, #475569 88%, #1e293b 100%);
      border: 1px solid rgba(248, 250, 252, 0.8);
      box-shadow: 0 25px 50px -10px rgba(148, 163, 184, 0.45), inset 0 1px 2px rgba(255, 255, 255, 0.65);
    }
    .theme-black {
      background: radial-gradient(circle at 40% 25%, #181d24 0%, #0a0d12 60%, #020305 100%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 25px 60px -10px rgba(0, 0, 0, 0.98), inset 0 1px 1px rgba(255, 255, 255, 0.25);
    }

    .card-transition-surface {
      transition: background 0.65s cubic-bezier(0.22, 1, 0.36, 1), 
                  border-color 0.65s cubic-bezier(0.22, 1, 0.36, 1), 
                  box-shadow 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .pattern-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 1;
      transition: opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .pattern-hidden { opacity: 0 !important; }

    .pattern-viza {
      background-image: 
        radial-gradient(circle at 75% 50%, transparent 15%, rgba(255, 255, 255, 0.12) 16%, transparent 18%),
        radial-gradient(circle at 75% 50%, transparent 32%, rgba(255, 255, 255, 0.10) 33%, transparent 36%),
        radial-gradient(circle at 75% 50%, transparent 50%, rgba(255, 255, 255, 0.08) 51%, transparent 55%),
        linear-gradient(45deg, transparent 46%, rgba(255, 255, 255, 0.08) 50%, transparent 54%);
    }
    .pattern-masterkard {
      background-image: 
        radial-gradient(circle at 35% 50%, rgba(255, 255, 255, 0.14) 0%, transparent 45%),
        radial-gradient(circle at 65% 50%, rgba(255, 255, 255, 0.14) 0%, transparent 45%),
        repeating-linear-gradient(60deg, transparent, transparent 14px, rgba(255, 255, 255, 0.04) 14px, rgba(255, 255, 255, 0.04) 15px);
    }
    .pattern-onionpay {
      background-image: 
        repeating-linear-gradient(135deg, transparent, transparent 12px, rgba(255, 255, 255, 0.05) 12px, rgba(255, 255, 255, 0.05) 24px),
        radial-gradient(rgba(255, 255, 255, 0.12) 1.5px, transparent 1.5px);
      background-size: 100% 100%, 14px 14px;
    }
    .pattern-mig {
      background-image: 
        linear-gradient(110deg, transparent 20%, rgba(255, 255, 255, 0.15) 22%, transparent 26%),
        linear-gradient(110deg, transparent 42%, rgba(255, 255, 255, 0.18) 44%, transparent 48%),
        linear-gradient(110deg, transparent 66%, rgba(255, 255, 255, 0.12) 68%, transparent 71%);
    }

    /* БЫСТРО МИГАЮЩИЕ ЦИФРЫ */
    .number-groups-container {
      display: flex;
      justify-content: space-between;
      width: 100%;
    }

    .digit-group-block {
      display: flex;
      gap: 1.5px;
    }

    .flash-digit-cell {
      width: 14.5px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 2px 0 #000000, 0 -1px 0 rgba(255, 255, 255, 0.7), 0 0 5px rgba(0, 0, 0, 0.85);
      transition: color 0.15s ease, transform 0.15s ease, filter 0.15s ease, text-shadow 0.15s ease, opacity 0.15s ease;
    }

    .flash-digit-cell.is-flashing {
      color: rgba(148, 163, 184, 0.35) !important;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4) !important;
      filter: blur(1px) !important;
      transform: scale(0.95);
      opacity: 0.6;
    }

    /* СЛОТ ЛОГОТИПА И ТИПАЖА */
    .network-display-box {
      height: 38px;
      width: 96px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      position: relative;
    }

    .network-display-box svg {
      max-height: 36px;
      max-width: 94px;
      display: block;
      transition: filter 0.55s ease, opacity 0.55s ease, transform 0.1s ease;
    }

    .network-display-box.is-flashing svg {
      opacity: 0.45;
      filter: grayscale(0.5) blur(0.6px);
      transform: scale(0.96);
    }

    .logo-black-mode svg {
      filter: grayscale(1) brightness(1.7) contrast(1.2) drop-shadow(0 2px 4px rgba(0,0,0,0.9)) !important;
      opacity: 0.95;
    }

    .card-tier-label {
      font-size: 9px;
      font-family: 'Share Tech Mono', monospace;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.85;
      margin-top: 1px;
      text-align: right;
      width: 100%;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      transition: opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1), transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), color 0.15s ease;
    }

    .card-tier-label.is-flashing {
      color: rgba(148, 163, 184, 0.4) !important;
      text-shadow: none !important;
      opacity: 0.5;
    }

    .card-tier-label.tier-dissolved {
      opacity: 0 !important;
      transform: translateY(4px) scale(0.95) !important;
      pointer-events: none;
    }

    .holo-sheen {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      pointer-events: none;
      background: linear-gradient(115deg, transparent 20%, rgba(255, 255, 255, 0.08) 45%, rgba(255, 255, 255, 0.32) 50%, rgba(255, 255, 255, 0.08) 55%, transparent 80%);
      background-size: 250% 250%;
      background-position: 50% 50%;
      mix-blend-mode: overlay;
      opacity: 0.85;
      z-index: 20;
    }

    .rarity-dash {
      flex: 1;
      height: 4.5px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.07);
      transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
    }

    .rarity-dash.active {
      transform: scaleY(1.4);
    }

    .typewriter-cursor {
      display: inline-block;
      width: 6px;
      height: 12px;
      background-color: #38bdf8;
      margin-left: 2px;
      vertical-align: middle;
      animation: blinkCursor 0.7s infinite;
    }
    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="flex flex-col justify-between p-3 max-w-md mx-auto min-h-screen">

  <!-- ШАПКА -->
  <header class="w-full flex items-center justify-between bg-vaultPanel border border-vaultBorder rounded-2xl px-3 py-2 shadow-md">
    <div class="flex items-center space-x-2.5 overflow-hidden">
      <div class="relative w-9 h-9 flex-shrink-0">
        <div id="avatarFallback" class="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-600 to-blue-600 flex items-center justify-center font-bold text-white text-xs shadow">
          U
        </div>
        <img id="avatarImg" src="" alt="" class="w-9 h-9 rounded-xl object-cover shadow hidden" onerror="this.classList.add('hidden'); document.getElementById('avatarFallback').classList.remove('hidden');">
      </div>
      <div class="flex flex-col min-w-0">
        <span id="userName" class="text-xs font-bold text-slate-100 truncate">Telegram User</span>
        <div class="flex items-center space-x-1 text-xs font-mono font-black text-emerald-400">
          <span id="userBalanceText">10 000</span>
          <span>₽</span>
        </div>
      </div>
    </div>

    <button onclick="openInventoryModal()" class="flex items-center space-x-2 px-3 py-1.5 rounded-xl bg-slate-800/80 border border-slate-700/80 active:scale-95 transition-transform">
      <span class="text-[11px] font-semibold text-slate-300">💼 Кошелёк:</span>
      <span id="inventoryCountBadge" class="text-[11px] font-bold text-sky-400 font-mono">0</span>
    </button>
  </header>

  <!-- ЦЕНТР: РЕДКОСТЬ + КАРТА -->
  <main class="w-full my-auto flex flex-col items-center py-1">
    
    <div class="w-full max-w-[350px] mb-2 px-3 py-2 bg-vaultPanel/95 border border-vaultBorder rounded-2xl flex flex-col items-center shadow-lg backdrop-blur-sm">
      <h1 id="heroRarityBig" class="text-xl sm:text-2xl font-black tracking-wider uppercase transition-all duration-300 drop-shadow-md text-slate-400">
        ОБЫЧНАЯ
      </h1>

      <div class="w-full flex items-center justify-between gap-1.5 mt-2 px-1">
        <div id="dash-0" class="rarity-dash active"></div>
        <div id="dash-1" class="rarity-dash"></div>
        <div id="dash-2" class="rarity-dash"></div>
        <div id="dash-3" class="rarity-dash"></div>
        <div id="dash-4" class="rarity-dash"></div>
        <div id="dash-5" class="rarity-dash"></div>
        <div id="dash-6" class="rarity-dash"></div>
      </div>
    </div>

    <!-- КАРТА -->
    <div class="card-perspective-stage w-full flex justify-center">
      <div id="cardStage" class="bank-card card-transition-surface theme-classic p-4 sm:p-5 flex flex-col justify-between cursor-pointer">
        
        <div id="cardSpinOverlay" class="card-spin-overlay"></div>
        <div id="cardPattern" class="pattern-overlay pattern-viza"></div>
        <div id="holoSheen" class="holo-sheen"></div>

        <!-- ВЕРХ: ЧИП + NFC -->
        <div class="flex justify-between items-start z-10">
          <div class="w-10 h-7 rounded bg-gradient-to-br from-[#f6d365] via-[#d4af37] to-[#aa7c11] p-1 flex flex-col justify-between shadow-md border border-amber-200/50">
            <div class="w-full h-[1px] bg-amber-950/40"></div>
            <div class="flex justify-between items-center h-2">
              <div class="w-2 h-[1px] bg-amber-950/40"></div>
              <div class="w-2 h-2 rounded border border-amber-950/40"></div>
              <div class="w-2 h-[1px] bg-amber-950/40"></div>
            </div>
            <div class="w-full h-[1px] bg-amber-950/40"></div>
          </div>

          <div class="text-white/85 drop-shadow-md">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <path d="M7 6a10 10 0 0 1 0 12" />
              <path d="M11 4a14 14 0 0 1 0 16" />
              <path d="M15 2a18 18 0 0 1 0 20" />
            </svg>
          </div>
        </div>

        <!-- ЦЕНТР: 16 МИГАЮЩИХ ЦИФР -->
        <div class="my-auto z-10 pt-1">
          <div class="number-groups-container" id="casinoNumbersTrackContainer"></div>

          <div class="flex justify-end items-center mt-1">
            <span id="copyToast" class="text-[9px] font-mono font-bold text-cyan-300 opacity-0 transition-opacity">НОМЕР СКОПИРОВАН</span>
          </div>
        </div>

        <!-- НИЗ: ЛОГОТИП + ТИПАЖ -->
        <div class="flex justify-end items-end z-10 -mr-1 -mb-1.5">
          <div class="flex flex-col items-end text-right">
            <div class="network-display-box" id="networkDisplayBox"></div>
            <div id="cardTierLabel" class="card-tier-label">classic</div>
          </div>
        </div>

      </div>
    </div>

    <!-- БЛОК СТОИМОСТИ + TYPEWRITER -->
    <div class="w-full max-w-[350px] mt-2 p-3 bg-vaultPanel/95 border border-vaultBorder rounded-2xl flex flex-col shadow-lg">
      <div class="flex justify-between items-center pb-1.5 border-b border-slate-800/80">
        <span class="text-[10px] font-mono uppercase font-bold text-slate-400">ОЦЕНКА КАРТЫ:</span>
        <div class="flex items-center space-x-1">
          <span class="text-base font-black font-mono text-emerald-400" id="cardPriceText">350 ₽</span>
        </div>
      </div>

      <div class="py-2 min-h-[64px] flex flex-col justify-center">
        <div class="text-[10px] font-mono text-slate-300 leading-relaxed space-y-1" id="typewriterBox">
          <div id="typewriterLine1"></div>
          <div id="typewriterLine2"></div>
        </div>
      </div>

      <div class="pt-1.5 border-t border-slate-800/80 flex items-center justify-between gap-2">
        <button id="btnKeepWallet" onclick="keepInWallet()" class="w-full py-1.5 rounded-xl bg-sky-950/60 border border-sky-600/50 text-sky-300 text-xs font-bold active:scale-95 transition flex items-center justify-center space-x-1.5 shadow">
          <span>💼 Добавить в кошелёк</span>
        </button>
      </div>
    </div>

  </main>

  <!-- НИЗ: КНОПКА КРУТИТЬ -->
  <footer class="w-full space-y-1.5 z-20 mt-1">
    <button id="rollButton" onclick="startCardRoll()" class="w-full py-3.5 rounded-2xl font-bold text-sm tracking-wider uppercase bg-gradient-to-r from-blue-600 via-indigo-600 to-cyan-500 text-white shadow-lg shadow-blue-500/25 active:scale-[0.98] transition-all flex items-center justify-center space-x-2">
      <span id="rollButtonText">КРУТИТЬ КАРТУ (500 ₽)</span>
    </button>

    <div class="p-1 rounded-xl bg-vaultPanel/60 border border-vaultBorder">
      <p class="text-[9px] text-slate-400 font-mono text-center leading-relaxed">
        🔄 Нажатие «Крутить» автоматически продает карту и начисляет ₽. Нажмите «В кошелёк», чтобы сохранить пластик.
      </p>
    </div>
  </footer>

  <!-- МОДАЛЬНОЕ ОКНО КОШЕЛЬКА -->
  <div id="inventoryModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex flex-col justify-end">
    <div class="bg-vaultPanel border-t border-vaultBorder rounded-t-3xl p-5 max-h-[85vh] flex flex-col">
      <div class="flex justify-between items-center pb-3 border-b border-slate-800">
        <div>
          <h3 class="text-sm font-bold text-white uppercase tracking-wider">Кошелёк карт</h3>
          <p class="text-[10px] text-slate-400 font-mono">Сохраненные пластиковые карты</p>
        </div>
        <button onclick="closeInventoryModal()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-300 flex items-center justify-center text-sm font-bold active:scale-95">✕</button>
      </div>

      <div id="inventoryList" class="overflow-y-auto no-scrollbar py-3 space-y-2.5 my-auto"></div>

      <button onclick="clearInventory()" class="w-full py-2.5 rounded-xl bg-red-950/40 border border-red-800/40 text-red-300 text-xs font-bold active:scale-98 transition">
        Очистить кошелёк
      </button>
    </div>
  </div>

  <script>
    const SPIN_COST = 500;

    const NETWORKS = [
      {
        id: 'viza',
        name: 'VIZA',
        bin: '3040',
        patternClass: 'pattern-viza',
        svg: `<svg viewBox="0 0 160 55" fill="none"><text x="5" y="44" font-family="-apple-system, Arial Black, sans-serif" font-weight="900" font-style="italic" font-size="50" fill="#FFFFFF" letter-spacing="-1">VIZA</text></svg>`
      },
      {
        id: 'masterkard',
        name: 'MasterKard',
        bin: '7550',
        patternClass: 'pattern-masterkard',
        svg: `<svg viewBox="0 0 110 70" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="0" y="0" width="68" height="70" rx="26" fill="#EA001B" /><rect x="42" y="0" width="68" height="70" rx="26" fill="#FFB000" opacity="0.94" /></svg>`
      },
      {
        id: 'onionpay',
        name: 'OnionPay',
        bin: '1862',
        patternClass: 'pattern-onionpay',
        svg: `<svg viewBox="0 0 135 60" fill="none"><g transform="skewX(-14)"><rect x="16" y="2" width="34" height="54" rx="5" fill="#6B11D9" /><rect x="46" y="2" width="34" height="54" rx="5" fill="#059669" /><rect x="76" y="2" width="40" height="54" rx="4" fill="#EAB308" /></g><text x="68" y="26" text-anchor="middle" font-family="-apple-system, sans-serif" font-weight="900" font-style="italic" font-size="17" fill="#FFFFFF">OnionPay</text><text x="68" y="46" text-anchor="middle" font-family="-apple-system, sans-serif" font-weight="800" font-size="14" fill="#FFFFFF" letter-spacing="1">洋葱</text></svg>`
      },
      {
        id: 'mig',
        name: 'МИГ',
        bin: '9200',
        patternClass: 'pattern-mig',
        svg: `<svg viewBox="0 0 160 55" fill="none"><path d="M 5 50 V 6 H 18 L 29 28 L 40 6 H 53 V 50 H 39 V 23 L 30 40 H 28 L 19 23 V 50 H 5 Z" fill="#22C55E" /><path d="M 62 50 V 6 H 76 V 32 L 95 6 H 109 V 50 H 95 V 23 L 76 50 H 62 Z" fill="#22C55E" /><path d="M 118 50 V 22 H 133 V 50 H 118 Z" fill="#22C55E" /><path d="M 116 6 H 158 C 158 14 150 18 138 18 H 116 V 6 Z" fill="#0EA5E9" /></svg>`
      }
    ];

    const CARD_TIERS = [
      { id: 'classic', name: 'classic', baseRubles: 350, weight: 58.0, themeClass: 'theme-classic', labelColor: '#93c5fd' },
      { id: 'gold', name: 'gold', baseRubles: 1400, weight: 26.0, themeClass: 'theme-gold', labelColor: '#fef08a' },
      { id: 'platinum', name: 'platinum', baseRubles: 4500, weight: 12.0, themeClass: 'theme-platinum', labelColor: '#f8fafc' },
      { id: 'black', name: 'black', baseRubles: 18000, weight: 4.0, themeClass: 'theme-black', labelColor: '#ffffff' }
    ];

    const RARITY_STAGES = [
      { index: 0, name: 'ОБЫЧНАЯ', color: '#94a3b8', glow: '0 0 12px rgba(148, 163, 184, 0.4)' },
      { index: 1, name: 'НЕОБЫЧНАЯ', color: '#6ee7b7', glow: '0 0 14px rgba(110, 231, 183, 0.5)' },
      { index: 2, name: 'РЕДКАЯ', color: '#38bdf8', glow: '0 0 16px rgba(56, 189, 248, 0.6)' },
      { index: 3, name: 'МИСТИЧЕСКАЯ', color: '#818cf8', glow: '0 0 18px rgba(129, 140, 248, 0.65)' },
      { index: 4, name: 'ЭПИЧЕСКАЯ', color: '#e879f9', glow: '0 0 20px rgba(232, 121, 249, 0.7)' },
      { index: 5, name: 'ЛЕГЕНДАРНАЯ', color: '#fbbf24', glow: '0 0 24px rgba(251, 191, 36, 0.8)' },
      { index: 6, name: 'МИФИЧЕСКАЯ', color: '#f8fafc', glow: '0 0 26px rgba(255, 255, 255, 0.9)' }
    ];

    let userRubles = parseInt(localStorage.getItem('vault_rubles') || '10000');
    function updateBalanceUI() {
      document.getElementById('userBalanceText').innerText = userRubles.toLocaleString('ru-RU');
      localStorage.setItem('vault_rubles', userRubles.toString());
    }

    // ИНИЦИАЛИЗАЦИЯ ЦИФР
    const NUM_CONTAINER = document.getElementById('casinoNumbersTrackContainer');
    const digitCells = [];
    let currentNumbers = [3,0,4,0, 8,4,9,2, 1,0,4,8, 2,9,1,4];

    for (let g = 0; g < 4; g++) {
      const groupEl = document.createElement('div');
      groupEl.className = 'digit-group-block';

      for (let d = 0; d < 4; d++) {
        const idx = g * 4 + d;
        const cell = document.createElement('div');
        cell.className = 'flash-digit-cell';
        cell.textContent = currentNumbers[idx];
        groupEl.appendChild(cell);
        digitCells.push(cell);
      }
      NUM_CONTAINER.appendChild(groupEl);
    }

    const networkBox = document.getElementById('networkDisplayBox');
    networkBox.innerHTML = NETWORKS[0].svg;

    function evaluateCardFull(tier, net, digits16) {
      const numStr = digits16.join('');
      const middle = numStr.substring(4, 15);

      const factorList = [];
      let multiplier = 1.0;

      const quadMatch = middle.match(/(\d)\1\1\1/);
      if (quadMatch) {
        factorList.push({ name: `Квадро-код [${quadMatch[1].repeat(4)}]`, mult: 3.5, bonusText: '+250%' });
        multiplier *= 3.5;
      }

      if (/0123|1234|2345|3456|4567|5678|6789|9876|8765|5432|4321/.test(middle)) {
        factorList.push({ name: 'Лесенка чисел', mult: 2.8, bonusText: '+180%' });
        multiplier *= 2.8;
      }

      const p1 = middle.substring(0, 4);
      const p2 = middle.substring(4, 8);
      if (p1 === p1.split('').reverse().join('') || p2 === p2.split('').reverse().join('')) {
        factorList.push({ name: 'Зеркальный код (палиндром)', mult: 2.0, bonusText: '+100%' });
        multiplier *= 2.0;
      }

      if (/1337/.test(middle)) {
        factorList.push({ name: 'Культовый код [1337]', mult: 4.0, bonusText: '+300%' });
        multiplier *= 4.0;
      } else if (/0420|6969/.test(middle)) {
        factorList.push({ name: 'Lucky Meme [69/420]', mult: 2.5, bonusText: '+150%' });
        multiplier *= 2.5;
      }

      let rarityIndex = 0;
      if (tier.id === 'black' && multiplier >= 4.0) rarityIndex = 6;
      else if (tier.id === 'black' || multiplier >= 6.0) rarityIndex = 5;
      else if (tier.id === 'platinum' || multiplier >= 3.5) rarityIndex = 4;
      else if (tier.id === 'platinum' || multiplier >= 2.5) rarityIndex = 3;
      else if (tier.id === 'gold' || factorList.length >= 1) rarityIndex = 2;
      else if (tier.id === 'gold' || multiplier > 1.0) rarityIndex = 1;
      else rarityIndex = 0;

      const finalPrice = Math.round(tier.baseRubles * multiplier);
      const addedRubles = finalPrice - tier.baseRubles;

      return {
        rarity: RARITY_STAGES[rarityIndex],
        factorList,
        multiplier: multiplier.toFixed(1),
        finalPrice,
        addedRubles
      };
    }

    function generateAntiLuhnNumber(binPrefix) {
      let digits = binPrefix.split('').map(Number);
      while (digits.length < 15) {
        digits.push(Math.floor(Math.random() * 10));
      }
      let sum = 0;
      for (let i = 0; i < 15; i++) {
        let d = digits[14 - i];
        if (i % 2 === 0) {
          d *= 2;
          if (d > 9) d -= 9;
        }
        sum += d;
      }
      const validCheck = (10 - (sum % 10)) % 10;
      const invalidCheck = (validCheck + 3) % 10;
      digits.push(invalidCheck);
      return digits;
    }

    let audioCtx = null;
    function playBeep(freq = 440, type = 'sine', duration = 0.05, gainVal = 0.04) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function triggerHaptic(type = 'light') {
      const tg = window.Telegram?.WebApp;
      if (tg?.HapticFeedback) {
        if (type === 'success' || type === 'warning' || type === 'error') {
          tg.HapticFeedback.notificationOccurred(type);
        } else {
          tg.HapticFeedback.impactOccurred(type);
        }
      }
    }

    let typewriterTimeout1 = null;
    let typewriterTimeout2 = null;

    function typeWriterEffect(line1Text, line2Html) {
      const l1 = document.getElementById('typewriterLine1');
      const l2 = document.getElementById('typewriterLine2');

      clearTimeout(typewriterTimeout1);
      clearTimeout(typewriterTimeout2);

      l1.innerHTML = '<span class="typewriter-cursor"></span>';
      l2.innerHTML = '';

      let idx = 0;
      function typeChar() {
        if (idx < line1Text.length) {
          l1.innerHTML = line1Text.substring(0, idx + 1) + '<span class="typewriter-cursor"></span>';
          idx++;
          playBeep(850 + Math.random() * 200, 'sine', 0.015, 0.015);
          typewriterTimeout1 = setTimeout(typeChar, 18);
        } else {
          l1.innerHTML = line1Text;
          l2.innerHTML = line2Html;
          playBeep(980, 'sine', 0.08, 0.04);
        }
      }
      typeChar();
    }

    let currentNetwork = NETWORKS[0];
    let currentTier = CARD_TIERS[0];
    let currentEval = null;
    let isCardSavedInWallet = false;

    function applyCardVisuals(net, tier, digits) {
      const card = document.getElementById('cardStage');
      const pattern = document.getElementById('cardPattern');
      const tierLabel = document.getElementById('cardTierLabel');

      CARD_TIERS.forEach(t => card.classList.remove(t.themeClass));
      card.classList.add(tier.themeClass);

      NETWORKS.forEach(n => pattern.classList.remove(n.patternClass));
      pattern.classList.add(net.patternClass);

      if (tier.id === 'black') {
        networkBox.classList.add('logo-black-mode');
        tierLabel.classList.add('tier-dissolved');
      } else {
        networkBox.classList.remove('logo-black-mode');
        tierLabel.classList.remove('tier-dissolved');
        tierLabel.innerText = tier.name;
        tierLabel.style.color = tier.labelColor;
      }

      currentEval = evaluateCardFull(tier, net, digits);

      const bigWord = document.getElementById('heroRarityBig');
      bigWord.innerText = currentEval.rarity.name;
      bigWord.style.color = currentEval.rarity.color;
      bigWord.style.textShadow = currentEval.rarity.glow;

      for (let i = 0; i < 7; i++) {
        const dash = document.getElementById(`dash-${i}`);
        if (dash) {
          if (i === currentEval.rarity.index) {
            dash.classList.add('active');
            dash.style.background = currentEval.rarity.color;
            dash.style.boxShadow = currentEval.rarity.glow;
          } else {
            dash.classList.remove('active');
            dash.style.background = 'rgba(255, 255, 255, 0.07)';
            dash.style.boxShadow = 'none';
          }
        }
      }

      document.getElementById('cardPriceText').innerText = `${currentEval.finalPrice.toLocaleString('ru-RU')} ₽`;

      const factorsStr = currentEval.factorList.length > 0
        ? currentEval.factorList.map(f => `${f.name} (${f.bonusText})`).join(' • ')
        : 'Стандартная серия номера';

      const line1 = `Пластик: [${tier.name.toUpperCase()}] • BIN ${net.bin} • ${factorsStr}`;
      const line2 = `База: ${tier.baseRubles} ₽ • Множитель: x${currentEval.multiplier} • Прибавка: +${currentEval.addedRubles} ₽`;

      typeWriterEffect(line1, line2);

      isCardSavedInWallet = false;
      const keepBtn = document.getElementById('btnKeepWallet');
      keepBtn.disabled = false;
      keepBtn.classList.remove('opacity-50');
      keepBtn.innerHTML = `<span>💼 Добавить в кошелёк</span>`;
    }

    // ================= ГЛАВНЫЙ ЦИКЛ (2 СЕКУНДЫ + ПЛАВНОЕ УТАПЛИВАНИЕ) =================
    let isRolling = false;

    function startCardRoll() {
      if (isRolling) return;

      if (userRubles < SPIN_COST) {
        triggerHaptic('error');
        alert("Недостаточно средств на балансе! Пополните баланс.");
        return;
      }

      if (currentEval && !isCardSavedInWallet) {
        userRubles += currentEval.finalPrice;
      }

      userRubles -= SPIN_COST;
      updateBalanceUI();

      isRolling = true;
      triggerHaptic('heavy');
      playBeep(320, 'square', 0.08, 0.06);

      const btn = document.getElementById('rollButton');
      const btnText = document.getElementById('rollButtonText');
      const card = document.getElementById('cardStage');
      const pattern = document.getElementById('cardPattern');
      const spinOverlay = document.getElementById('cardSpinOverlay');
      const tierLabel = document.getElementById('cardTierLabel');

      btn.disabled = true;
      btn.classList.add('opacity-75');
      btnText.innerText = 'ПОДБОР ПЛАСТИКА...';

      // 1. Плавный уход карты назад и подготовка к миганию
      networkBox.classList.remove('logo-black-mode');
      networkBox.classList.add('is-flashing');
      tierLabel.classList.remove('tier-dissolved');
      tierLabel.classList.add('is-flashing');

      spinOverlay.classList.add('active');
      card.classList.add('card-compressed'); // Плавное утапливание через 0.75s transition
      pattern.classList.add('pattern-hidden');

      const targetNetIdx = Math.floor(Math.random() * NETWORKS.length);
      const targetNetwork = NETWORKS[targetNetIdx];
      const targetTier = CARD_TIERS[Math.floor(Math.random() * CARD_TIERS.length)];
      const targetDigits = generateAntiLuhnNumber(targetNetwork.bin);

      digitCells.forEach(cell => cell.classList.add('is-flashing'));

      // 2. УСКОРЕННЫЕ ТАЙМИНГИ ПОД 2.0 СЕКУНДЫ
      const stopTimes = [800, 1200, 1600, 2000];
      const isGroupStopped = [false, false, false, false];

      const tierNames = ['classic', 'gold', 'platinum', 'black'];
      let startTime = performance.now();
      let lastDigitShuffle = 0;
      let lastLogoShuffle = 0;
      let lastTierShuffle = 0;

      function flickerLoop(now) {
        const elapsed = now - startTime;

        // Быстрое мигание цифр (каждые 24 мс для максимальной скорости)
        if (now - lastDigitShuffle > 24) {
          lastDigitShuffle = now;
          for (let g = 0; g < 4; g++) {
            if (elapsed < stopTimes[g]) {
              for (let d = 0; d < 4; d++) {
                const idx = g * 4 + d;
                digitCells[idx].textContent = Math.floor(Math.random() * 10);
              }
            } else if (!isGroupStopped[g]) {
              isGroupStopped[g] = true;
              for (let d = 0; d < 4; d++) {
                const idx = g * 4 + d;
                digitCells[idx].textContent = targetDigits[idx];
                digitCells[idx].classList.remove('is-flashing');
              }
              triggerHaptic('medium');
              playBeep(520 + g * 100, 'triangle', 0.035, 0.04);
            }
          }
        }

        // Мигание логотипов (каждые 40 мс)
        if (elapsed < stopTimes[0]) {
          if (now - lastLogoShuffle > 40) {
            lastLogoShuffle = now;
            const randNet = NETWORKS[Math.floor(Math.random() * NETWORKS.length)];
            networkBox.innerHTML = randNet.svg;
          }
        } else {
          networkBox.innerHTML = targetNetwork.svg;
          networkBox.classList.remove('is-flashing');
        }

        // Мигание типажей
        if (elapsed < stopTimes[3]) {
          if (now - lastTierShuffle > 40) {
            lastTierShuffle = now;
            tierLabel.innerText = tierNames[Math.floor(Math.random() * tierNames.length)];
          }
        }

        if (elapsed < stopTimes[3]) {
          requestAnimationFrame(flickerLoop);
        } else {
          // 3. ПЛАВНЫЙ ВОЗВРАТ КАРТЫ ВПЕРЕД И КРОССФЕЙД
          tierLabel.classList.remove('is-flashing');

          currentNetwork = targetNetwork;
          currentTier = targetTier;
          currentNumbers = targetDigits;

          applyCardVisuals(currentNetwork, currentTier, currentNumbers);

          spinOverlay.classList.remove('active');
          pattern.classList.remove('pattern-hidden');
          card.classList.remove('card-compressed'); // Плавное всплывание вперед

          setTimeout(() => {
            btn.disabled = false;
            btn.classList.remove('opacity-75');
            btnText.innerText = `КРУТИТЬ КАРТУ (${SPIN_COST} ₽)`;
            isRolling = false;

            if (currentEval.rarity.index >= 5) {
              triggerHaptic('success');
              playBeep(940, 'sine', 0.25, 0.1);
            } else {
              triggerHaptic('medium');
              playBeep(640, 'sine', 0.1, 0.06);
            }
          }, 450);
        }
      }

      requestAnimationFrame(flickerLoop);
    }

    function keepInWallet() {
      if (isRolling || !currentEval || isCardSavedInWallet) return;

      isCardSavedInWallet = true;
      saveCardToStorage({
        number: currentNumbers.join(''),
        network: currentNetwork.name,
        tier: currentTier.name,
        bin: currentNetwork.bin,
        rarity: currentEval.rarity.name,
        color: currentEval.rarity.color,
        price: currentEval.finalPrice,
        date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });

      triggerHaptic('success');
      playBeep(880, 'sine', 0.15, 0.08);

      const btn = document.getElementById('btnKeepWallet');
      btn.innerHTML = `<span>✅ Добавлено в кошелёк (не будет продано)</span>`;
      btn.disabled = true;
      btn.classList.add('opacity-50');
    }

    // 3D Наклон
    const stage = document.getElementById('cardStage');
    const sheen = document.getElementById('holoSheen');

    function handleCardMove(x, y, rect) {
      if (isRolling) return;
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const rotY = ((x - centerX) / (rect.width / 2)) * 14;
      const rotX = -((y - centerY) / (rect.height / 2)) * 14;

      stage.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg) scale(1.02)`;
      sheen.style.backgroundPosition = `${50 + rotY * 2.5}% ${50 + rotX * 2.5}%`;
    }

    function resetCardMove() {
      if (isRolling) return;
      stage.style.transform = `rotateX(0deg) rotateY(0deg) scale(1)`;
      sheen.style.backgroundPosition = `50% 50%`;
    }

    stage.addEventListener('mousemove', (e) => handleCardMove(e.clientX, e.clientY, stage.getBoundingClientRect()));
    stage.addEventListener('mouseleave', resetCardMove);
    stage.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) handleCardMove(e.touches[0].clientX, e.touches[0].clientY, stage.getBoundingClientRect());
    }, { passive: true });
    stage.addEventListener('touchend', resetCardMove);

    // Копирование номера
    stage.addEventListener('click', () => {
      if (isRolling) return;
      const fullNum = currentNumbers.join('');
      const formatted = `${fullNum.slice(0,4)} ${fullNum.slice(4,8)} ${fullNum.slice(8,12)} ${fullNum.slice(12,16)}`;

      const input = document.createElement('input');
      input.value = formatted;
      document.body.appendChild(input);
      input.select();
      document.execCommand('copy');
      document.body.removeChild(input);

      triggerHaptic('light');
      playBeep(750, 'sine', 0.05, 0.04);

      const toast = document.getElementById('copyToast');
      toast.classList.remove('opacity-0');
      setTimeout(() => toast.classList.add('opacity-0'), 1300);
    });

    // Инвентарь
    function getStoredCards() {
      try { return JSON.parse(localStorage.getItem('vault_cards_wallet_v3') || '[]'); } catch (e) { return []; }
    }
    function saveCardToStorage(cardObj) {
      const list = getStoredCards();
      list.unshift(cardObj);
      if (list.length > 50) list.pop();
      localStorage.setItem('vault_cards_wallet_v3', JSON.stringify(list));
      updateInventoryBadge();
    }
    function updateInventoryBadge() {
      document.getElementById('inventoryCountBadge').innerText = getStoredCards().length;
    }
    function openInventoryModal() {
      triggerHaptic('light');
      const modal = document.getElementById('inventoryModal');
      const listContainer = document.getElementById('inventoryList');
      const cards = getStoredCards();

      if (cards.length === 0) {
        listContainer.innerHTML = `<div class="text-center py-8 text-slate-500 font-mono text-xs">Кошелёк пуст.<br>Нажмите «Добавить в кошелёк» при выпадении карты!</div>`;
      } else {
        listContainer.innerHTML = cards.map(c => `
          <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-3 flex justify-between items-center">
            <div>
              <span class="text-xs font-mono font-bold text-slate-100 tracking-wider">${c.number.replace(/(\d{4})/g, '$1 ').trim()}</span>
              <div class="flex items-center space-x-1.5 mt-1">
                <span class="text-[9px] font-mono px-2 py-0.5 rounded bg-slate-800 font-bold" style="color: ${c.color}">${c.rarity}</span>
                <span class="text-[9px] font-mono px-1.5 py-0.5 rounded bg-slate-800/80 text-slate-300 uppercase">${c.tier}</span>
                <span class="text-[10px] text-emerald-400 font-bold font-mono">${c.price} ₽</span>
              </div>
            </div>
            <span class="text-[9px] font-mono text-slate-500">${c.date}</span>
          </div>
        `).join('');
      }
      modal.classList.remove('hidden');
    }
    function closeInventoryModal() {
      triggerHaptic('light');
      document.getElementById('inventoryModal').classList.add('hidden');
    }
    function clearInventory() {
      triggerHaptic('warning');
      localStorage.removeItem('vault_cards_wallet_v3');
      updateInventoryBadge();
      openInventoryModal();
    }

    function initTelegramIntegration() {
      const tg = window.Telegram?.WebApp;
      if (tg) {
        tg.ready();
        tg.expand();
      }
      const user = tg?.initDataUnsafe?.user;
      if (user) {
        document.getElementById('userName').innerText = [user.first_name, user.last_name].filter(Boolean).join(' ') || 'Telegram User';
        if (user.photo_url) {
          document.getElementById('avatarImg').src = user.photo_url;
          document.getElementById('avatarImg').classList.remove('hidden');
          document.getElementById('avatarFallback').classList.add('hidden');
        } else {
          document.getElementById('avatarFallback').innerText = (user.first_name[0] || 'U').toUpperCase();
        }
      }
      updateBalanceUI();
    }

    window.addEventListener('load', () => {
      initTelegramIntegration();
      applyCardVisuals(currentNetwork, currentTier, currentNumbers);
      updateInventoryBadge();
    });
  </script>
</body>
