<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Card Vault TMA</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Google Fonts: Share Tech Mono (банковский OCR) + Space Grotesk -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Space+Grotesk:wght@600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            vaultDark: '#070a0e',
            vaultPanel: '#0e131b',
            vaultBorder: 'rgba(255, 255, 255, 0.08)'
          },
          fontFamily: {
            emboss: ['"Share Tech Mono"', 'Courier', 'monospace'],
            sans: ['"Space Grotesk"', '-apple-system', 'BlinkMacSystemFont', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #070a0e;
      color: #e2e8f0;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      overflow-x: hidden;
      font-family: 'Space Grotesk', -apple-system, sans-serif;
    }

    /* 3D Сцена */
    .card-perspective-stage {
      perspective: 1200px;
    }

    .bank-card {
      aspect-ratio: 85.6 / 53.98;
      width: 100%;
      max-width: 350px;
      border-radius: 20px;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.65s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.65s ease;
      overflow: hidden;
    }

    /* ================= СЛОЕНЫЙ ОВЕРЛЕЙ КРУЧЕНИЯ (ДЛЯ МЯГКОГО КРОССФЕЙДА) ================= */
    .card-spin-overlay {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      background: linear-gradient(135deg, #151821 0%, #2a313e 25%, #161a22 50%, #363f50 75%, #13161f 100%);
      background-size: 300% 300%;
      opacity: 0;
      pointer-events: none;
      z-index: 5;
      transition: opacity 0.65s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .card-spin-overlay.active {
      opacity: 1;
      animation: spinShimmer 1.4s ease infinite;
    }

    .card-compressed {
      transform: scale(0.93) rotateX(10deg) !important;
      box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.9), inset 0 1px 2px rgba(255, 255, 255, 0.2) !important;
    }

    @keyframes spinShimmer {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ================= ЦВЕТОВЫЕ ТЕМЫ КАРТ ================= */
    .theme-classic {
      background: radial-gradient(circle at 85% 20%, #0284c7 0%, #0369a1 40%, #075985 70%, #082f49 100%);
      border: 1px solid rgba(56, 189, 248, 0.5);
      box-shadow: 0 25px 50px -10px rgba(2, 132, 199, 0.45), inset 0 1px 2px rgba(255, 255, 255, 0.4);
    }
    .theme-gold {
      background: linear-gradient(135deg, #d97706 0%, #f59e0b 28%, #fbbf24 50%, #b45309 78%, #78350f 100%);
      border: 1px solid rgba(254, 243, 199, 0.65);
      box-shadow: 0 25px 50px -10px rgba(217, 119, 6, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.7);
    }
    .theme-platinum {
      background: linear-gradient(135deg, #cbd5e1 0%, #94a3b8 32%, #64748b 62%, #475569 88%, #1e293b 100%);
      border: 1px solid rgba(248, 250, 252, 0.8);
      box-shadow: 0 25px 50px -10px rgba(148, 163, 184, 0.45), inset 0 1px 2px rgba(255, 255, 255, 0.65);
    }
    .theme-black {
      background: radial-gradient(circle at 35% 20%, #232834 0%, #0d1017 55%, #020305 100%);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 25px 55px -10px rgba(0, 0, 0, 0.95), inset 0 1px 1.5px rgba(255, 255, 255, 0.3);
    }

    .card-transition-surface {
      transition: background 0.7s cubic-bezier(0.16, 1, 0.3, 1), 
                  border-color 0.7s cubic-bezier(0.16, 1, 0.3, 1), 
                  box-shadow 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Узоры BIN */
    .pattern-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 1;
      transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .pattern-hidden { opacity: 0 !important; }

    .pattern-viza {
      background-image: 
        radial-gradient(circle at 75% 50%, transparent 15%, rgba(255, 255, 255, 0.12) 16%, transparent 18%),
        radial-gradient(circle at 75% 50%, transparent 32%, rgba(255, 255, 255, 0.10) 33%, transparent 36%),
        radial-gradient(circle at 75% 50%, transparent 50%, rgba(255, 255, 255, 0.08) 51%, transparent 55%),
        linear-gradient(45deg, transparent 46%, rgba(255, 255, 255, 0.08) 50%, transparent 54%);
    }
    .pattern-masterkard {
      background-image: 
        radial-gradient(circle at 35% 50%, rgba(255, 255, 255, 0.14) 0%, transparent 45%),
        radial-gradient(circle at 65% 50%, rgba(255, 255, 255, 0.14) 0%, transparent 45%),
        repeating-linear-gradient(60deg, transparent, transparent 14px, rgba(255, 255, 255, 0.04) 14px, rgba(255, 255, 255, 0.04) 15px);
    }
    .pattern-onionpay {
      background-image: 
        repeating-linear-gradient(135deg, transparent, transparent 12px, rgba(255, 255, 255, 0.05) 12px, rgba(255, 255, 255, 0.05) 24px),
        radial-gradient(rgba(255, 255, 255, 0.12) 1.5px, transparent 1.5px);
      background-size: 100% 100%, 14px 14px;
    }
    .pattern-mig {
      background-image: 
        linear-gradient(110deg, transparent 20%, rgba(255, 255, 255, 0.15) 22%, transparent 26%),
        linear-gradient(110deg, transparent 42%, rgba(255, 255, 255, 0.18) 44%, transparent 48%),
        linear-gradient(110deg, transparent 66%, rgba(255, 255, 255, 0.12) 68%, transparent 71%);
    }

    /* ================= КАЗИНО-БАРАБАНЫ ЦИФР ================= */
    :root {
      --digit-h: 28px;
    }

    .number-groups-container {
      display: flex;
      justify-content: space-between;
      width: 100%;
    }

    .digit-group-block {
      display: flex;
      gap: 1.5px;
    }

    .slot-digit-viewport {
      width: 14.5px;
      height: var(--digit-h);
      overflow: hidden;
      position: relative;
      display: inline-block;
    }

    .slot-digit-track {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      will-change: transform;
      transform: translate3d(0, 0, 0);
    }

    .slot-num-cell {
      height: var(--digit-h);
      line-height: var(--digit-h);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 2px 0 #000000, 0 -1px 0 rgba(255, 255, 255, 0.7), 0 0 5px rgba(0, 0, 0, 0.85);
    }

    .slot-motion-blur {
      filter: blur(1.8px);
      opacity: 0.8;
      color: #38bdf8 !important;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.9) !important;
    }

    /* Барабан логотипов */
    .network-slot-box {
      height: 40px;
      width: 95px;
      overflow: hidden;
      position: relative;
    }

    .network-slot-track {
      position: absolute;
      top: 0;
      right: 0;
      width: 100%;
      will-change: transform;
    }

    .network-slot-item {
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }

    .network-slot-item svg {
      max-height: 38px;
      max-width: 90px;
      display: block;
    }

    /* Блик */
    .holo-sheen {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      pointer-events: none;
      background: linear-gradient(115deg, transparent 20%, rgba(255, 255, 255, 0.08) 45%, rgba(255, 255, 255, 0.32) 50%, rgba(255, 255, 255, 0.08) 55%, transparent 80%);
      background-size: 250% 250%;
      background-position: 50% 50%;
      mix-blend-mode: overlay;
      opacity: 0.85;
      z-index: 20;
    }

    /* Мягкая анимация инфо-панели */
    .info-soft-reveal {
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="flex flex-col justify-between p-4 max-w-md mx-auto min-h-screen">

  <!-- ШАПКА -->
  <header class="w-full flex items-center justify-between bg-vaultPanel border border-vaultBorder rounded-2xl px-3.5 py-2.5 shadow-md">
    <div class="flex items-center space-x-3 overflow-hidden">
      <div class="relative w-9 h-9 flex-shrink-0">
        <div id="avatarFallback" class="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-600 to-blue-600 flex items-center justify-center font-bold text-white text-xs shadow">
          U
        </div>
        <img id="avatarImg" src="" alt="" class="w-9 h-9 rounded-xl object-cover shadow hidden" onerror="this.classList.add('hidden'); document.getElementById('avatarFallback').classList.remove('hidden');">
      </div>
      <div class="flex flex-col min-w-0">
        <span id="userName" class="text-xs font-bold text-slate-100 truncate">Telegram User</span>
        <span id="userHandle" class="text-[10px] text-cyan-400 font-mono truncate">@handle</span>
      </div>
    </div>

    <button onclick="openInventoryModal()" class="flex items-center space-x-2 px-3 py-1.5 rounded-xl bg-slate-800/80 border border-slate-700/80 active:scale-95 transition-transform">
      <span class="text-[11px] font-semibold text-slate-300">Склад:</span>
      <span id="inventoryCountBadge" class="text-[11px] font-bold text-emerald-400 font-mono">0</span>
    </button>
  </header>

  <!-- ЦЕНТР: ИНФО-ПАНЕЛЬ + КАРТА -->
  <main class="w-full my-auto flex flex-col items-center py-2">
    
    <!-- ИНФО НАД КАРТОЙ -->
    <div class="w-full max-w-[350px] mb-3 px-4 py-3 bg-vaultPanel/95 border border-vaultBorder rounded-2xl flex flex-col items-center shadow-xl backdrop-blur-sm">
      <div class="w-full flex items-center justify-center py-0.5">
        <h1 id="heroRarityText" class="text-2xl sm:text-3xl font-black tracking-wider uppercase info-soft-reveal drop-shadow-md text-[#94a3b8]">
          ОБЫЧНЫЙ
        </h1>
      </div>

      <div class="w-full mt-2 pt-2 border-t border-slate-800/90 flex items-center justify-between px-1">
        <div class="flex items-center space-x-1.5">
          <span class="text-[10px] uppercase font-mono text-slate-500 font-bold">ТИП:</span>
          <span id="heroTierBadge" class="text-[11px] font-mono font-bold tracking-wider px-2 py-0.5 rounded bg-slate-800 text-sky-400 border border-slate-700/80 info-soft-reveal">
            CLASSIC
          </span>
        </div>

        <div class="flex items-center space-x-2">
          <div id="heroMiniLogoSlot" class="h-4 flex items-center justify-center info-soft-reveal"></div>
          <span id="heroNetworkName" class="text-xs font-black tracking-wide font-sans text-white info-soft-reveal">
            VIZA
          </span>
        </div>
      </div>
    </div>

    <!-- КАРТА С КАЗИНО-БАРАБАНАМИ -->
    <div class="card-perspective-stage w-full flex justify-center">
      <div id="cardStage" class="bank-card card-transition-surface theme-classic p-5 sm:p-6 flex flex-col justify-between cursor-pointer">
        
        <!-- Оверлей кручения для мягкого растворения -->
        <div id="cardSpinOverlay" class="card-spin-overlay"></div>

        <div id="cardPattern" class="pattern-overlay pattern-viza"></div>
        <div id="holoSheen" class="holo-sheen"></div>

        <!-- ВЕРХ: ЧИП + NFC -->
        <div class="flex justify-between items-start z-10">
          <div class="w-11 h-8 rounded-md bg-gradient-to-br from-[#f6d365] via-[#d4af37] to-[#aa7c11] p-1 flex flex-col justify-between shadow-md border border-amber-200/50">
            <div class="w-full h-[1px] bg-amber-950/40"></div>
            <div class="flex justify-between items-center h-2">
              <div class="w-2.5 h-[1px] bg-amber-950/40"></div>
              <div class="w-2.5 h-2.5 rounded border border-amber-950/40"></div>
              <div class="w-2.5 h-[1px] bg-amber-950/40"></div>
            </div>
            <div class="w-full h-[1px] bg-amber-950/40"></div>
          </div>

          <div class="text-white/85 drop-shadow-md">
            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
              <path d="M7 6a10 10 0 0 1 0 12" />
              <path d="M11 4a14 14 0 0 1 0 16" />
              <path d="M15 2a18 18 0 0 1 0 20" />
            </svg>
          </div>
        </div>

        <!-- ЦЕНТР: 16 КАЗИНО-БАРАБАНОВ -->
        <div class="my-auto z-10 pt-2">
          <div class="number-groups-container" id="casinoNumbersTrackContainer"></div>

          <div class="flex justify-end items-center mt-1">
            <span id="copyToast" class="text-[9px] font-mono font-bold text-cyan-300 opacity-0 transition-opacity">НОМЕР СКОПИРОВАН</span>
          </div>
        </div>

        <!-- НИЗ: БАРАБАН ЛОГОТИПОВ -->
        <div class="flex justify-end items-end z-10">
          <div class="network-slot-box">
            <div id="networkSlotTrack" class="network-slot-track"></div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- НИЗ: КНОПКА -->
  <footer class="w-full space-y-2.5 z-20">
    <button id="rollButton" onclick="startCardRoll()" class="w-full py-3.5 rounded-2xl font-bold text-sm tracking-wider uppercase bg-gradient-to-r from-blue-600 via-indigo-600 to-cyan-500 text-white shadow-lg shadow-blue-500/25 active:scale-[0.98] transition-all flex items-center justify-center space-x-2">
      <span id="rollButtonText">КРУТИТЬ КАРТУ</span>
    </button>

    <div class="p-2 rounded-xl bg-vaultPanel/60 border border-vaultBorder">
      <p class="text-[9px] text-slate-400 font-mono text-center leading-relaxed">
        🛡️ <span class="text-slate-300 font-bold">ANTI-LUHN SAFEGUARD:</span> 16-я цифра рассчитывается со сдвигом. Номер гарантированно ломает алгоритм Луна.
      </p>
    </div>
  </footer>

  <!-- ИНВЕНТАРЬ -->
  <div id="inventoryModal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex flex-col justify-end">
    <div class="bg-vaultPanel border-t border-vaultBorder rounded-t-3xl p-5 max-h-[85vh] flex flex-col">
      <div class="flex justify-between items-center pb-3 border-b border-slate-800">
        <div>
          <h3 class="text-sm font-bold text-white uppercase tracking-wider">Инвентарь карт</h3>
          <p class="text-[10px] text-slate-400 font-mono">Сохраняется локально</p>
        </div>
        <button onclick="closeInventoryModal()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-300 flex items-center justify-center text-sm font-bold active:scale-95">✕</button>
      </div>

      <div id="inventoryList" class="overflow-y-auto no-scrollbar py-3 space-y-2.5 my-auto"></div>

      <button onclick="clearInventory()" class="w-full py-2.5 rounded-xl bg-red-950/40 border border-red-800/40 text-red-300 text-xs font-bold active:scale-98 transition">
        Очистить инвентарь
      </button>
    </div>
  </div>

  <script>
    const NETWORKS = [
      {
        id: 'viza',
        name: 'VIZA',
        bin: '3040',
        patternClass: 'pattern-viza',
        titleStyle: 'font-style: italic; font-weight: 900; color: #ffffff;',
        svg: `<svg viewBox="0 0 160 55" fill="none"><text x="5" y="44" font-family="-apple-system, Arial Black, sans-serif" font-weight="900" font-style="italic" font-size="50" fill="#FFFFFF" letter-spacing="-1">VIZA</text></svg>`,
        miniSvg: `<svg viewBox="0 0 160 55" fill="none" class="h-3.5 w-auto"><text x="5" y="44" font-family="-apple-system, Arial Black, sans-serif" font-weight="900" font-style="italic" font-size="50" fill="#FFFFFF">VIZA</text></svg>`
      },
      {
        id: 'masterkard',
        name: 'MasterKard',
        bin: '7550',
        patternClass: 'pattern-masterkard',
        titleStyle: 'font-weight: 800; color: #ffffff;',
        svg: `<svg viewBox="0 0 110 70" fill="none"><rect x="0" y="0" width="68" height="70" rx="26" fill="#EA001B" /><rect x="42" y="0" width="68" height="70" rx="26" fill="#FFB000" /><path d="M 42 12 C 55 18 64 33 64 50 C 64 56 61 63 56 68 C 61 63 68 50 68 35 C 68 20 61 8 50 2 C 46 5 44 8 42 12 Z" fill="#FF5E00" opacity="0.95" /></svg>`,
        miniSvg: `<svg viewBox="0 0 110 70" fill="none" class="h-3.5 w-auto"><rect x="0" y="0" width="68" height="70" rx="26" fill="#EA001B" /><rect x="42" y="0" width="68" height="70" rx="26" fill="#FFB000" /></svg>`
      },
      {
        id: 'onionpay',
        name: 'OnionPay',
        bin: '1862',
        patternClass: 'pattern-onionpay',
        titleStyle: 'font-style: italic; font-weight: 800; color: #34d399;',
        svg: `<svg viewBox="0 0 135 60" fill="none"><g transform="skewX(-14)"><rect x="16" y="2" width="34" height="54" rx="5" fill="#6B11D9" /><rect x="46" y="2" width="34" height="54" rx="5" fill="#059669" /><rect x="76" y="2" width="40" height="54" rx="4" fill="#EAB308" /></g><text x="68" y="26" text-anchor="middle" font-family="-apple-system, sans-serif" font-weight="900" font-style="italic" font-size="17" fill="#FFFFFF">OnionPay</text><text x="68" y="46" text-anchor="middle" font-family="-apple-system, sans-serif" font-weight="800" font-size="14" fill="#FFFFFF" letter-spacing="1">洋葱</text></svg>`,
        miniSvg: `<svg viewBox="0 0 135 60" fill="none" class="h-3.5 w-auto"><g transform="skewX(-14)"><rect x="16" y="2" width="34" height="54" rx="5" fill="#6B11D9" /><rect x="46" y="2" width="34" height="54" rx="5" fill="#059669" /><rect x="76" y="2" width="40" height="54" rx="4" fill="#EAB308" /></g></svg>`
      },
      {
        id: 'mig',
        name: 'МИГ',
        bin: '9200',
        patternClass: 'pattern-mig',
        titleStyle: 'font-weight: 900; color: #22c55e;',
        svg: `<svg viewBox="0 0 160 55" fill="none"><path d="M 5 50 V 6 H 18 L 29 28 L 40 6 H 53 V 50 H 39 V 23 L 30 40 H 28 L 19 23 V 50 H 5 Z" fill="#22C55E" /><path d="M 62 50 V 6 H 76 V 32 L 95 6 H 109 V 50 H 95 V 23 L 76 50 H 62 Z" fill="#22C55E" /><path d="M 118 50 V 22 H 133 V 50 H 118 Z" fill="#22C55E" /><path d="M 116 6 H 158 C 158 14 150 18 138 18 H 116 V 6 Z" fill="#0EA5E9" /></svg>`,
        miniSvg: `<svg viewBox="0 0 160 55" fill="none" class="h-3.5 w-auto"><path d="M 5 50 V 6 H 18 L 29 28 L 40 6 H 53 V 50 H 39 V 23 L 30 40 H 28 L 19 23 V 50 H 5 Z" fill="#22C55E" /><path d="M 62 50 V 6 H 76 V 32 L 95 6 H 109 V 50 H 95 V 23 L 76 50 H 62 Z" fill="#22C55E" /><path d="M 118 50 V 22 H 133 V 50 H 118 Z" fill="#22C55E" /><path d="M 116 6 H 158 C 158 14 150 18 138 18 H 116 V 6 Z" fill="#0EA5E9" /></svg>`
      }
    ];

    const CARD_TIERS = [
      { id: 'classic', name: 'CLASSIC', weight: 60.0, themeClass: 'theme-classic', color: '#38bdf8' },
      { id: 'gold', name: 'GOLD', weight: 25.0, themeClass: 'theme-gold', color: '#fbbf24' },
      { id: 'platinum', name: 'PLATINUM', weight: 11.0, themeClass: 'theme-platinum', color: '#e2e8f0' },
      { id: 'black', name: 'BLACK', weight: 4.0, themeClass: 'theme-black', color: '#a855f7' }
    ];

    // ================= ПОСТРОЕНИЕ 16 БАРАБАНОВ =================
    const DIGIT_HEIGHT = 28;
    const NUM_CONTAINER = document.getElementById('casinoNumbersTrackContainer');
    const digitTracks = [];
    let currentNumbers = [3,0,4,0, 8,4,9,2, 1,0,4,8, 2,9,1,4];

    for (let g = 0; g < 4; g++) {
      const groupEl = document.createElement('div');
      groupEl.className = 'digit-group-block';

      for (let d = 0; d < 4; d++) {
        const slotVp = document.createElement('div');
        slotVp.className = 'slot-digit-viewport';

        const trackEl = document.createElement('div');
        trackEl.className = 'slot-digit-track';

        let html = '';
        for (let loop = 0; loop < 10; loop++) {
          for (let n = 0; n <= 9; n++) {
            html += `<div class="slot-num-cell">${n}</div>`;
          }
        }
        trackEl.innerHTML = html;
        slotVp.appendChild(trackEl);
        groupEl.appendChild(slotVp);
        digitTracks.push(trackEl);
      }
      NUM_CONTAINER.appendChild(groupEl);
    }

    // Барабан логотипов
    const NETWORK_TRACK = document.getElementById('networkSlotTrack');
    const NET_HEIGHT = 40;
    let netHtml = '';
    for (let loop = 0; loop < 10; loop++) {
      NETWORKS.forEach(net => {
        netHtml += `<div class="network-slot-item">${net.svg}</div>`;
      });
    }
    NETWORK_TRACK.innerHTML = netHtml;

    function setSlotInitialPosition(track, num) {
      track.style.transition = 'none';
      track.style.transform = `translate3d(0, -${num * DIGIT_HEIGHT}px, 0)`;
    }

    digitTracks.forEach((track, i) => setSlotInitialPosition(track, currentNumbers[i]));

    function evaluateCardRarity(tierId, digits16) {
      const numStr = digits16.join('');
      const middle = numStr.substring(4, 15);
      const isFourSame = /(.)\1\1\1/.test(middle);
      const isAscending = /0123|1234|2345|3456|4567|5678|6789/.test(middle);
      const isPairs = /(\d)\1.*(\d)\2/.test(middle);

      if (tierId === 'black' && (isFourSame || isAscending)) {
        return { name: 'МИФИЧЕСКИЙ', color: '#c084fc', glow: '0 0 25px rgba(192, 132, 252, 0.7)' };
      }
      if (tierId === 'black' || isFourSame) {
        return { name: 'ЛЕГЕНДАРНЫЙ', color: '#fbbf24', glow: '0 0 22px rgba(251, 191, 36, 0.65)' };
      }
      if (tierId === 'platinum' || tierId === 'gold' || isAscending || isPairs) {
        return { name: 'РЕДКИЙ', color: '#cbd5e1', glow: '0 0 12px rgba(203, 213, 225, 0.35)' };
      }
      return { name: 'ОБЫЧНЫЙ', color: '#94a3b8', glow: 'none' };
    }

    function generateAntiLuhnNumber(binPrefix) {
      let digits = binPrefix.split('').map(Number);
      while (digits.length < 15) {
        digits.push(Math.floor(Math.random() * 10));
      }
      let sum = 0;
      for (let i = 0; i < 15; i++) {
        let d = digits[14 - i];
        if (i % 2 === 0) {
          d *= 2;
          if (d > 9) d -= 9;
        }
        sum += d;
      }
      const validCheck = (10 - (sum % 10)) % 10;
      const invalidCheck = (validCheck + 3) % 10;
      digits.push(invalidCheck);
      return digits;
    }

    let audioCtx = null;
    function playBeep(freq = 440, type = 'sine', duration = 0.05, gainVal = 0.04) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function triggerHaptic(type = 'light') {
      const tg = window.Telegram?.WebApp;
      if (tg?.HapticFeedback) {
        if (type === 'success' || type === 'warning' || type === 'error') {
          tg.HapticFeedback.notificationOccurred(type);
        } else {
          tg.HapticFeedback.impactOccurred(type);
        }
      }
    }

    function initTelegramIntegration() {
      const tg = window.Telegram?.WebApp;
      if (tg) {
        tg.ready();
        tg.expand();
      }
      const user = tg?.initDataUnsafe?.user;
      if (user) {
        document.getElementById('userName').innerText = [user.first_name, user.last_name].filter(Boolean).join(' ') || 'Telegram User';
        document.getElementById('userHandle').innerText = user.username ? `@${user.username}` : `ID: ${user.id}`;
        if (user.photo_url) {
          document.getElementById('avatarImg').src = user.photo_url;
          document.getElementById('avatarImg').classList.remove('hidden');
          document.getElementById('avatarFallback').classList.add('hidden');
        } else {
          document.getElementById('avatarFallback').innerText = (user.first_name[0] || 'U').toUpperCase();
        }
      }
    }

    let currentNetwork = NETWORKS[0];
    let currentTier = CARD_TIERS[0];

    function applyCardVisuals(net, tier, digits) {
      const card = document.getElementById('cardStage');
      const pattern = document.getElementById('cardPattern');

      CARD_TIERS.forEach(t => card.classList.remove(t.themeClass));
      card.classList.add(tier.themeClass);

      NETWORKS.forEach(n => pattern.classList.remove(n.patternClass));
      pattern.classList.add(net.patternClass);

      const rarity = evaluateCardRarity(tier.id, digits);
      const heroRarity = document.getElementById('heroRarityText');
      heroRarity.innerText = rarity.name;
      heroRarity.style.color = rarity.color;
      heroRarity.style.textShadow = rarity.glow;

      const heroTier = document.getElementById('heroTierBadge');
      heroTier.innerText = tier.name;
      heroTier.style.color = tier.color;

      document.getElementById('heroMiniLogoSlot').innerHTML = net.miniSvg;
      const heroNetName = document.getElementById('heroNetworkName');
      heroNetName.innerText = net.name;
      heroNetName.style = net.titleStyle;
    }

    // ================= ГЛАВНЫЙ ЦИКЛ СЛОТ-МАШИНЫ =================
    let isRolling = false;

    function startCardRoll() {
      if (isRolling) return;
      isRolling = true;
      triggerHaptic('heavy');
      playBeep(320, 'square', 0.08, 0.06);

      const btn = document.getElementById('rollButton');
      const btnText = document.getElementById('rollButtonText');
      const card = document.getElementById('cardStage');
      const pattern = document.getElementById('cardPattern');
      const spinOverlay = document.getElementById('cardSpinOverlay');

      btn.disabled = true;
      btn.classList.add('opacity-75');
      btnText.innerText = 'КРУТИТСЯ БАРАБАН...';

      // 1. Мягкое затемнение инфо-панели
      const infoItems = document.querySelectorAll('.info-soft-reveal');
      infoItems.forEach(el => {
        el.style.opacity = '0.35';
        el.style.transform = 'scale(0.95)';
      });

      // 2. Включаем переливающийся оверлей и сжимаем карту назад
      spinOverlay.classList.add('active');
      card.classList.add('card-compressed');
      pattern.classList.add('pattern-hidden');

      const targetNetIdx = Math.floor(Math.random() * NETWORKS.length);
      const targetNetwork = NETWORKS[targetNetIdx];
      const targetTier = CARD_TIERS[Math.floor(Math.random() * CARD_TIERS.length)];
      const targetDigits = generateAntiLuhnNumber(targetNetwork.bin);

      // Сброс дорожек
      digitTracks.forEach((track, i) => {
        track.style.transition = 'none';
        track.style.transform = `translate3d(0, -${currentNumbers[i] * DIGIT_HEIGHT}px, 0)`;
        track.classList.add('slot-motion-blur');
      });
      NETWORK_TRACK.style.transition = 'none';
      NETWORK_TRACK.style.transform = `translate3d(0, 0px, 0)`;

      void card.offsetWidth;

      // 3. Запуск логотипов
      const targetNetPos = -( (4 * NETWORKS.length + targetNetIdx) * NET_HEIGHT );
      NETWORK_TRACK.style.transition = 'transform 2.0s cubic-bezier(0.12, 0.95, 0.25, 1.05)';
      NETWORK_TRACK.style.transform = `translate3d(0, ${targetNetPos}px, 0)`;

      // 4. Запуск цифр
      digitTracks.forEach((track, idx) => {
        const groupIndex = Math.floor(idx / 4);
        const spinCycles = 3 + groupIndex * 2;
        const targetDigit = targetDigits[idx];
        const finalY = -( (spinCycles * 10 + targetDigit) * DIGIT_HEIGHT );

        const duration = 1.6 + groupIndex * 0.45 + (idx % 4) * 0.05;
        track.style.transition = `transform ${duration}s cubic-bezier(0.12, 0.95, 0.25, 1.15)`;
        track.style.transform = `translate3d(0, ${finalY}px, 0)`;

        setTimeout(() => {
          track.classList.remove('slot-motion-blur');
          playBeep(520 + groupIndex * 80, 'triangle', 0.03, 0.03);
          triggerHaptic('light');
        }, duration * 1000 - 150);
      });

      // 5. МЯГКИЙ КРОССФЕЙД И ПОЯВЛЕНИЕ (за 400мс до полного завершения)
      setTimeout(() => {
        currentNetwork = targetNetwork;
        currentTier = targetTier;
        currentNumbers = targetDigits;

        // Задаем новый цвет и узор ПОД оверлеем
        applyCardVisuals(currentNetwork, currentTier, currentNumbers);

        // Плавно растворяем серый оверлей кручения
        spinOverlay.classList.remove('active');
        pattern.classList.remove('pattern-hidden');

        // Плавно расправляем карту вперед
        card.classList.remove('card-compressed');

        // Плавно проявляем инфо-панель
        infoItems.forEach(el => {
          el.style.opacity = '1';
          el.style.transform = 'scale(1)';
        });
      }, 3100);

      // 6. ФИНАЛ: триггер победы и разблокировка
      setTimeout(() => {
        btn.disabled = false;
        btn.classList.remove('opacity-75');
        btnText.innerText = 'КРУТИТЬ КАРТУ';
        isRolling = false;

        const rarity = evaluateCardRarity(currentTier.id, currentNumbers);
        saveCardToStorage({
          number: targetDigits.join(''),
          network: currentNetwork.name,
          tier: currentTier.name,
          bin: currentNetwork.bin,
          rarity: rarity.name,
          color: rarity.color,
          date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });

        if (rarity.name === 'МИФИЧЕСКИЙ' || rarity.name === 'ЛЕГЕНДАРНЫЙ') {
          triggerHaptic('success');
          playBeep(940, 'sine', 0.25, 0.1);
        } else {
          triggerHaptic('medium');
          playBeep(640, 'sine', 0.1, 0.06);
        }
      }, 3550);
    }

    // 3D Наклон
    const stage = document.getElementById('cardStage');
    const sheen = document.getElementById('holoSheen');

    function handleCardMove(x, y, rect) {
      if (isRolling) return;
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const rotY = ((x - centerX) / (rect.width / 2)) * 14;
      const rotX = -((y - centerY) / (rect.height / 2)) * 14;

      stage.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg) scale(1.02)`;
      sheen.style.backgroundPosition = `${50 + rotY * 2.5}% ${50 + rotX * 2.5}%`;
    }

    function resetCardMove() {
      if (isRolling) return;
      stage.style.transform = `rotateX(0deg) rotateY(0deg) scale(1)`;
      sheen.style.backgroundPosition = `50% 50%`;
    }

    stage.addEventListener('mousemove', (e) => handleCardMove(e.clientX, e.clientY, stage.getBoundingClientRect()));
    stage.addEventListener('mouseleave', resetCardMove);
    stage.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) handleCardMove(e.touches[0].clientX, e.touches[0].clientY, stage.getBoundingClientRect());
    }, { passive: true });
    stage.addEventListener('touchend', resetCardMove);

    // Копирование
    stage.addEventListener('click', () => {
      if (isRolling) return;
      const fullNum = currentNumbers.join('');
      const formatted = `${fullNum.slice(0,4)} ${fullNum.slice(4,8)} ${fullNum.slice(8,12)} ${fullNum.slice(12,16)}`;

      const input = document.createElement('input');
      input.value = formatted;
      document.body.appendChild(input);
      input.select();
      document.execCommand('copy');
      document.body.removeChild(input);

      triggerHaptic('light');
      playBeep(750, 'sine', 0.05, 0.04);

      const toast = document.getElementById('copyToast');
      toast.classList.remove('opacity-0');
      setTimeout(() => toast.classList.add('opacity-0'), 1300);
    });

    // Инвентарь
    function getStoredCards() {
      try { return JSON.parse(localStorage.getItem('vault_cards_v4') || '[]'); } catch (e) { return []; }
    }
    function saveCardToStorage(cardObj) {
      const list = getStoredCards();
      list.unshift(cardObj);
      if (list.length > 50) list.pop();
      localStorage.setItem('vault_cards_v4', JSON.stringify(list));
      updateInventoryBadge();
    }
    function updateInventoryBadge() {
      document.getElementById('inventoryCountBadge').innerText = getStoredCards().length;
    }
    function openInventoryModal() {
      triggerHaptic('light');
      const modal = document.getElementById('inventoryModal');
      const listContainer = document.getElementById('inventoryList');
      const cards = getStoredCards();

      if (cards.length === 0) {
        listContainer.innerHTML = `<div class="text-center py-8 text-slate-500 font-mono text-xs">Склад пуст.<br>Нажмите «Крутить карту» для первой генерации!</div>`;
      } else {
        listContainer.innerHTML = cards.map(c => `
          <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-3 flex justify-between items-center">
            <div>
              <span class="text-xs font-mono font-bold text-slate-100 tracking-wider">${c.number.replace(/(\d{4})/g, '$1 ').trim()}</span>
              <div class="flex items-center space-x-1.5 mt-1">
                <span class="text-[9px] font-mono px-2 py-0.5 rounded bg-slate-800 font-bold" style="color: ${c.color}">${c.rarity}</span>
                <span class="text-[9px] font-mono px-1.5 py-0.5 rounded bg-slate-800/80 text-slate-300">${c.tier}</span>
                <span class="text-[10px] text-cyan-400 font-semibold">${c.bin} • ${c.network}</span>
              </div>
            </div>
            <span class="text-[9px] font-mono text-slate-500">${c.date}</span>
          </div>
        `).join('');
      }
      modal.classList.remove('hidden');
    }
    function closeInventoryModal() {
      triggerHaptic('light');
      document.getElementById('inventoryModal').classList.add('hidden');
    }
    function clearInventory() {
      triggerHaptic('warning');
      localStorage.removeItem('vault_cards_v4');
      updateInventoryBadge();
      openInventoryModal();
    }

    window.addEventListener('load', () => {
      initTelegramIntegration();
      applyCardVisuals(currentNetwork, currentTier, currentNumbers);
      updateInventoryBadge();
    });
  </script>
</body>
</html>
